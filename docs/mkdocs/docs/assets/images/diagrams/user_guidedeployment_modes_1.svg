<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="600" height="300" fill="#fff"/>
  <rect x="20" y="10" width="560" height="240" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="560" height="28" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="29" text-anchor="middle" fill="#222" font-size="13" font-weight="bold" letter-spacing="0.3">Single Node Deployment</text>

  <!-- Layer 1: All boxes -->
  <!-- Container -->
  <rect x="50" y="50" width="500" height="165" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.2"/>
  <rect x="50" y="50" width="500" height="26" rx="2" fill="#EEEEEE" stroke="#BDBDBD" stroke-width="1.2"/>
  <text x="300" y="68" text-anchor="middle" fill="#616161" font-size="13" font-weight="bold">Single Node</text>

  <!-- Sub-components evenly distributed: 3 boxes w=130, inner span=460 (x=70..530), gap=(460-390)/2=35 -->
  <!-- x: 70, 235, 400 -->
  <rect x="70" y="95" width="130" height="30" rx="1" fill="#FFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="135" y="114" text-anchor="middle" fill="#424242" font-size="11">TrainerGroup</text>
  <rect x="235" y="95" width="130" height="30" rx="1" fill="#FFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="300" y="114" text-anchor="middle" fill="#424242" font-size="11">RolloutManager</text>
  <rect x="400" y="95" width="130" height="30" rx="1" fill="#FFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="465" y="114" text-anchor="middle" fill="#424242" font-size="11">DataCoordinator</text>

  <!-- ToolEnv below RolloutManager -->
  <rect x="235" y="160" width="130" height="30" rx="1" fill="#FFF" stroke="#E1BEE7" stroke-width="0.8"/>
  <text x="300" y="179" text-anchor="middle" fill="#424242" font-size="11">ToolEnv</text>

  <!-- Layer 2: Arrows + labels -->
  <line x1="200" y1="110" x2="235" y2="110" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="365" y1="110" x2="400" y2="110" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="300" y1="125" x2="300" y2="160" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Caption -->
  <text x="300" y="285" text-anchor="middle" fill="#555" font-size="10">Figure 1: All components on one machine</text>
</svg>
