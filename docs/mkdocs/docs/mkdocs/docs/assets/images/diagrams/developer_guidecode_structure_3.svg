<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
    <marker id="arr-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#90A4AE"/>
    </marker>
    <marker id="seq-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="860" height="580" fill="#fff"/>
  <rect x="20" y="10" width="820" height="520" rx="0" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="20" y="10" width="820" height="32" rx="0" fill="#F8F9FA" stroke="#333333" stroke-width="1.5"/>
  <text x="430.0" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">AgentFlow Loading &amp; Three-Stage Protocol</text>
  <rect x="50" y="52" width="760" height="200" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="430.0" y="68" text-anchor="middle" fill="#1565C0" font-size="13" font-weight="bold">AgentFlow Loading</text>
  <rect x="50" y="290" width="760" height="200" rx="2" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <text x="430.0" y="306" text-anchor="middle" fill="#2E7D32" font-size="13" font-weight="bold">Three-Stage Protocol</text>
  <rect x="70" y="100" width="250" height="30" rx="1" fill="#FFFFFF" stroke="#64B5F6" stroke-width="0.8"/>
  <text x="195.0" y="119.0" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">load_agentflow(config, model)</text>
  <rect x="360" y="100" width="200" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="460.0" y="119.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Import AgentFlow class</text>
  <rect x="600" y="100" width="190" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="695.0" y="119.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Instantiate agent</text>
  <rect x="250" y="170" width="360" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="430.0" y="189.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Inject preprocess_fn, generate_fn, reward_fn</text>
  <rect x="80" y="340" width="210" height="30" rx="1" fill="#FFFFFF" stroke="#81C784" stroke-width="0.8"/>
  <text x="185.0" y="359.0" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">agent.preprocess(sample)</text>
  <rect x="330" y="340" width="210" height="30" rx="1" fill="#FFFFFF" stroke="#81C784" stroke-width="0.8"/>
  <text x="435.0" y="359.0" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">agent.generate(sample)</text>
  <rect x="580" y="340" width="210" height="30" rx="1" fill="#FFFFFF" stroke="#81C784" stroke-width="0.8"/>
  <text x="685.0" y="359.0" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">agent.reward(sample)</text>
  <circle cx="140" cy="375" r="8" fill="#fff" stroke="#78909C" stroke-width="0.8"/>
  <text x="140" y="378.5" text-anchor="middle" fill="#78909C" font-size="8.5" font-weight="bold">1</text>
  <circle cx="390" cy="375" r="8" fill="#fff" stroke="#78909C" stroke-width="0.8"/>
  <text x="390" y="378.5" text-anchor="middle" fill="#78909C" font-size="8.5" font-weight="bold">2</text>
  <circle cx="640" cy="375" r="8" fill="#fff" stroke="#78909C" stroke-width="0.8"/>
  <text x="640" y="378.5" text-anchor="middle" fill="#78909C" font-size="8.5" font-weight="bold">3</text>
  <text x="185" y="410" text-anchor="middle" fill="#607D8B" font-size="10" font-weight="normal" font-style="italic">returns Sample</text>
  <text x="435" y="410" text-anchor="middle" fill="#607D8B" font-size="10" font-weight="normal" font-style="italic">async inference + tool interaction</text>
  <text x="685" y="410" text-anchor="middle" fill="#607D8B" font-size="10" font-weight="normal" font-style="italic">scalar reward</text>
  <line x1="320" y1="115.0" x2="360" y2="115.0" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="340.0" y="109.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">dynamic import</text>
  <line x1="560" y1="115.0" x2="600" y2="115.0" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="580.0" y="109.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">AgentFlowClass()</text>
  <path d="M695.0,130 L695,185 L610,185.0" fill="none" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="695" y="179" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">MethodType injection</text>
  <path d="M430.0,200 L430,270 L185,270 L185.0,340" fill="none" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="290" y1="355.0" x2="330" y2="355.0" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="310.0" y="349.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">returns Sample</text>
  <line x1="540" y1="355.0" x2="580" y2="355.0" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="560.0" y="349.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">async inference + tool</text>
  <text x="430.0" y="565" text-anchor="middle" fill="#555" font-size="10">Figure 3: AgentFlow Loading Pipeline</text>
</svg>
