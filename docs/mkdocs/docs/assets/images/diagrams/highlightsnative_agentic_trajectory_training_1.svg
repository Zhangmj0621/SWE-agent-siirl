<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 620" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#AB47BC"/>
    </marker>
  </defs>
  <rect width="450" height="620" fill="#fff"/>
  <rect x="20" y="10" width="410" height="560" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="410" height="28" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="225" y="29" text-anchor="middle" fill="#222" font-size="13" font-weight="bold" letter-spacing="0.3">Sample State Machine</text>

  <!-- Layer 1: All state boxes -->
  <!-- Start node -->
  <circle cx="225" cy="70" r="6" fill="#424242"/>

  <!-- States -->
  <rect x="125" y="110" width="200" height="36" rx="18" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="225" y="132" text-anchor="middle" fill="#1565C0" font-size="12" font-weight="600">PENDING</text>

  <rect x="125" y="180" width="200" height="36" rx="18" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="225" y="202" text-anchor="middle" fill="#1565C0" font-size="12" font-weight="600">GENERATING</text>

  <rect x="100" y="250" width="250" height="36" rx="18" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="225" y="272" text-anchor="middle" fill="#1565C0" font-size="12" font-weight="600">BEFORE_PROCESSING_ENV</text>

  <rect x="125" y="320" width="200" height="36" rx="18" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.2"/>
  <text x="225" y="342" text-anchor="middle" fill="#7B1FA2" font-size="12" font-weight="600">PROCESSING_ENV</text>

  <rect x="125" y="400" width="200" height="36" rx="18" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <text x="225" y="422" text-anchor="middle" fill="#2E7D32" font-size="12" font-weight="600">TERMINATED</text>

  <rect x="125" y="470" width="200" height="36" rx="18" fill="#FFEBEE" stroke="#EF9A9A" stroke-width="1.2"/>
  <text x="225" y="492" text-anchor="middle" fill="#C62828" font-size="12" font-weight="600">ABORTED</text>

  <!-- End node -->
  <circle cx="225" cy="550" r="8" fill="none" stroke="#424242" stroke-width="1.5"/>
  <circle cx="225" cy="550" r="5" fill="#424242"/>

  <!-- Layer 2: All arrows + labels -->

  <!-- Start → PENDING -->
  <rect x="175" y="78" width="74" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="225" y1="76" x2="225" y2="110" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="212" y="88" fill="#607D8B" font-size="9" font-style="italic">Sample created</text>

  <!-- PENDING → GENERATING -->
  <rect x="157" y="149" width="96" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="225" y1="146" x2="225" y2="180" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="205" y="159" fill="#607D8B" font-size="9" font-style="italic">apply_chat_template</text>

  <!-- GENERATING → BEFORE_PROCESSING_ENV -->
  <rect x="165" y="219" width="86" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="225" y1="216" x2="225" y2="250" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="208" y="229" fill="#607D8B" font-size="9" font-style="italic">Tool calls detected</text>

  <!-- GENERATING → TERMINATED (bypass, right side L-path) -->
  <rect x="352" y="292" width="66" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 325 198 L 370 198 L 370 418 L 325 418" fill="none" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="385" y="302" fill="#607D8B" font-size="9" font-style="italic">No tool / EOS</text>

  <!-- BEFORE_PROCESSING_ENV → PROCESSING_ENV -->
  <rect x="178" y="289" width="68" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="225" y1="286" x2="225" y2="320" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="212" y="299" fill="#607D8B" font-size="9" font-style="italic">Validate calls</text>

  <!-- PROCESSING_ENV → GENERATING (loop back, left side L-path) -->
  <rect x="42" y="256" width="80" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 125 338 L 80 338 L 80 198 L 125 198" fill="none" stroke="#AB47BC" stroke-width="1.2" marker-end="url(#arr-p)"/>
  <text x="82" y="266" fill="#7B1FA2" font-size="9" font-style="italic">Execute + append</text>

  <!-- PROCESSING_ENV → ABORTED -->
  <rect x="178" y="394" width="52" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="225" y1="356" x2="225" y2="470" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="204" y="404" fill="#607D8B" font-size="9" font-style="italic">Tool error</text>

  <!-- TERMINATED → End -->
  <rect x="172" y="447" width="74" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="225" y1="436" x2="225" y2="542" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="209" y="457" fill="#607D8B" font-size="9" font-style="italic">Compute reward</text>

  <!-- ABORTED → End -->
  <rect x="186" y="515" width="50" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="225" y1="506" x2="225" y2="542" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="211" y="525" fill="#607D8B" font-size="9" font-style="italic">Log error</text>

  <!-- Caption -->
  <text x="225" y="605" text-anchor="middle" fill="#555" font-size="10">Figure 1: Trajectory Generation States</text>
</svg>
