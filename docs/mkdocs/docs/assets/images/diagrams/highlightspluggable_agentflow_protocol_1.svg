<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="800" height="480" fill="#fff"/>
  <rect x="20" y="10" width="760" height="420" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="760" height="32" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">AgentFlow Protocol Classes</text>

  <!-- ====== Layer 1: All component boxes ====== -->

  <!-- AgentFlow box -->
  <rect x="40" y="60" width="200" height="120" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <rect x="40" y="60" width="200" height="26" rx="2" fill="#64B5F6"/>
  <text x="140" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">AgentFlow</text>
  <text x="50" y="98" fill="#424242" font-size="10.5">&lt;&lt;Protocol&gt;&gt;</text>
  <line x1="40" y1="106" x2="240" y2="106" stroke="#64B5F6" stroke-width="0.5"/>
  <text x="50" y="122" fill="#424242" font-size="10.5">preprocess(sample) → Sample</text>
  <text x="50" y="140" fill="#424242" font-size="10.5">generate(sample) → async</text>
  <text x="50" y="158" fill="#424242" font-size="10.5">reward(sample) → async</text>

  <!-- Sample box -->
  <rect x="290" y="60" width="200" height="180" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <rect x="290" y="60" width="200" height="26" rx="2" fill="#FFD54F"/>
  <text x="390" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Sample</text>
  <text x="300" y="98" fill="#424242" font-size="10.5">&lt;&lt;dataclass&gt;&gt;</text>
  <text x="300" y="116" fill="#424242" font-size="10.5">tokens: list[int]</text>
  <text x="300" y="134" fill="#424242" font-size="10.5">loss_mask: list[int]</text>
  <text x="300" y="152" fill="#424242" font-size="10.5">rollout_log_probs: list[float]</text>
  <text x="300" y="170" fill="#424242" font-size="10.5">conversations: list[dict]</text>
  <text x="300" y="188" fill="#424242" font-size="10.5">reward: float | None</text>
  <text x="300" y="206" fill="#424242" font-size="10.5">model: Model</text>
  <text x="300" y="224" fill="#424242" font-size="10.5">status: Status</text>

  <!-- Model box -->
  <rect x="540" y="60" width="220" height="100" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <rect x="540" y="60" width="220" height="26" rx="2" fill="#64B5F6"/>
  <text x="650" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Model</text>
  <text x="550" y="98" fill="#424242" font-size="10.5">&lt;&lt;Protocol&gt;&gt;</text>
  <line x1="540" y1="106" x2="760" y2="106" stroke="#64B5F6" stroke-width="0.5"/>
  <text x="550" y="122" fill="#424242" font-size="10.5">generate(convs, params) → Response</text>
  <text x="550" y="140" fill="#424242" font-size="10.5">tokenize(text) → list[int]</text>

  <!-- ModelResponse box -->
  <rect x="40" y="260" width="200" height="100" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <rect x="40" y="260" width="200" height="26" rx="2" fill="#FFD54F"/>
  <text x="140" y="278" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">ModelResponse</text>
  <text x="50" y="298" fill="#424242" font-size="10.5">&lt;&lt;dataclass&gt;&gt;</text>
  <text x="50" y="316" fill="#424242" font-size="10.5">text: str</text>
  <text x="50" y="334" fill="#424242" font-size="10.5">tokens: list[int]</text>
  <text x="50" y="352" fill="#424242" font-size="10.5">log_probs: list[float]</text>

  <!-- ====== Layer 2: All arrows + labels (drawn on top) ====== -->

  <!-- AgentFlow -> Sample: "creates" (horizontal) -->
  <rect x="244" y="107" width="42" height="14" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="240" y1="120" x2="290" y2="120" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="265" y="118" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">creates</text>

  <!-- Sample -> Model: "uses" (horizontal at y=150) -->
  <rect x="498" y="137" width="30" height="14" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="490" y1="150" x2="540" y2="150" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="515" y="148" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">uses</text>

  <!-- Model -> ModelResponse: "returns" (orthogonal L-path: right side down then left) -->
  <rect x="253" y="218" width="44" height="14" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 650 160 L 650 230 L 240 230 L 240 260" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="275" y="228" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">returns</text>

  <!-- Caption -->
  <text x="400" y="465" text-anchor="middle" fill="#555" font-size="10">Figure 1: Core protocol and data classes</text>
</svg>
