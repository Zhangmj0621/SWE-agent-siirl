<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
    <marker id="arr-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#90A4AE"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="480" fill="#fff"/>

  <!-- ================================================================ -->
  <!-- OUTER FRAME                                                      -->
  <!-- ================================================================ -->
  <rect x="20" y="10" width="880" height="410" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="20" y="10" width="880" height="32" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="460" y="31" text-anchor="middle" fill="#222" font-size="13" font-weight="bold" letter-spacing="0.3">
    siirl-agentic Async RL Training Architecture
  </text>

  <!-- ================================================================ -->
  <!-- DRIVER PROCESS (top center, neutral gray)                        -->
  <!-- ================================================================ -->
  <rect x="290" y="52" width="340" height="46" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1"/>
  <text x="460" y="66" text-anchor="middle" fill="#888" font-size="9" font-weight="600" letter-spacing="0.8">DRIVER PROCESS</text>

  <rect x="305" y="73" width="128" height="20" rx="1" fill="#fff" stroke="#9E9E9E" stroke-width="0.8"/>
  <text x="369" y="87" text-anchor="middle" fill="#555" font-size="10">MainRunner</text>

  <line x1="437" y1="83" x2="480" y2="83" stroke="#999" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="485" y="73" width="130" height="20" rx="1" fill="#fff" stroke="#9E9E9E" stroke-width="0.8"/>
  <text x="550" y="87" text-anchor="middle" fill="#555" font-size="10">TaskCoordinator</text>

  <!-- Ownership lines from Driver down to three subsystems -->
  <path d="M369,98 L369,112 L152,112 L152,128" stroke="#BDBDBD" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <line x1="460" y1="98" x2="460" y2="128" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M550,98 L550,112 L755,112 L755,128" stroke="#BDBDBD" stroke-width="1" fill="none" stroke-dasharray="4,3"/>

  <!-- ================================================================ -->
  <!-- THREE SUBSYSTEM REGIONS                                          -->
  <!-- ================================================================ -->

  <!-- ── Training (GPU) ── left, green ── -->
  <rect x="35" y="131" width="235" height="240" rx="2" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <text x="152" y="150" text-anchor="middle" fill="#2E7D32" font-size="11" font-weight="bold">Training (GPU)</text>

  <rect x="52" y="160" width="200" height="26" rx="1" fill="#fff" stroke="#81C784" stroke-width="0.8"/>
  <text x="152" y="178" text-anchor="middle" fill="#333" font-size="10.5" font-weight="600">TrainerGroup</text>

  <rect x="52" y="194" width="200" height="26" rx="1" fill="#fff" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="152" y="212" text-anchor="middle" fill="#555" font-size="10">Actor Model (Megatron)</text>

  <rect x="52" y="228" width="200" height="26" rx="1" fill="#fff" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="152" y="246" text-anchor="middle" fill="#555" font-size="10">Ref Model</text>

  <!-- Internal arrows (ownership) -->
  <line x1="152" y1="186" x2="152" y2="194" stroke="#B0BEC5" stroke-width="0.8"/>
  <line x1="152" y1="220" x2="152" y2="228" stroke="#B0BEC5" stroke-width="0.8"/>

  <!-- Algorithm label -->
  <text x="152" y="282" text-anchor="middle" fill="#66BB6A" font-size="9" font-style="italic">PPO / GRPO / Dr.GRPO</text>

  <!-- ── Data (CPU) ── center, amber ── -->
  <rect x="310" y="131" width="270" height="240" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <text x="445" y="150" text-anchor="middle" fill="#F57F17" font-size="11" font-weight="bold">Data (CPU)</text>

  <rect x="327" y="160" width="236" height="26" rx="1" fill="#fff" stroke="#FFD54F" stroke-width="0.8"/>
  <text x="445" y="178" text-anchor="middle" fill="#333" font-size="10.5" font-weight="600">DataCoordinator</text>

  <rect x="327" y="194" width="236" height="26" rx="1" fill="#fff" stroke="#FFE082" stroke-width="0.8"/>
  <text x="445" y="212" text-anchor="middle" fill="#555" font-size="10">DataBuffer / SampleQueue</text>

  <rect x="327" y="228" width="236" height="26" rx="1" fill="#fff" stroke="#FFE082" stroke-width="0.8"/>
  <text x="445" y="246" text-anchor="middle" fill="#555" font-size="10">DataLoader</text>

  <!-- Internal arrows -->
  <line x1="445" y1="186" x2="445" y2="194" stroke="#B0BEC5" stroke-width="0.8"/>
  <line x1="445" y1="220" x2="445" y2="228" stroke="#B0BEC5" stroke-width="0.8"/>

  <!-- ── Rollout (GPU + CPU) ── right, blue ── -->
  <rect x="620" y="131" width="260" height="240" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="750" y="150" text-anchor="middle" fill="#1565C0" font-size="11" font-weight="bold">Rollout (GPU + CPU)</text>

  <rect x="637" y="160" width="226" height="26" rx="1" fill="#fff" stroke="#64B5F6" stroke-width="0.8"/>
  <text x="750" y="178" text-anchor="middle" fill="#333" font-size="10.5" font-weight="600">RolloutManager</text>

  <rect x="637" y="194" width="226" height="26" rx="1" fill="#fff" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="750" y="212" text-anchor="middle" fill="#555" font-size="10">SGLang Engine</text>

  <rect x="637" y="228" width="226" height="26" rx="1" fill="#fff" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="750" y="246" text-anchor="middle" fill="#555" font-size="10">AgentFlow (NaiveFlow)</text>

  <rect x="637" y="262" width="226" height="26" rx="1" fill="#fff" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="750" y="280" text-anchor="middle" fill="#555" font-size="10">ToolEnv / AIO</text>

  <!-- Internal arrows -->
  <line x1="750" y1="186" x2="750" y2="194" stroke="#B0BEC5" stroke-width="0.8"/>
  <line x1="750" y1="220" x2="750" y2="228" stroke="#B0BEC5" stroke-width="0.8"/>
  <line x1="750" y1="254" x2="750" y2="262" stroke="#B0BEC5" stroke-width="0.8"/>

  <!-- Multi-turn label -->
  <text x="750" y="306" text-anchor="middle" fill="#64B5F6" font-size="9" font-style="italic">Multi-turn Trajectories</text>

  <!-- ================================================================ -->
  <!-- DATA FLOW ARROWS (between regions)                               -->
  <!-- ================================================================ -->

  <!-- ② Rollout → Data : completed samples -->
  <line x1="620" y1="207" x2="568" y2="207" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="594" y="199" text-anchor="middle" fill="#607D8B" font-size="8.5" font-style="italic">completed samples</text>

  <!-- ③ Data → Training : training batch -->
  <line x1="310" y1="207" x2="258" y2="207" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="284" y="199" text-anchor="middle" fill="#607D8B" font-size="8.5" font-style="italic">training batch</text>

  <!-- ④ Training → Rollout : param sync (bottom U-path, dashed) -->
  <path d="M152,371 L152,392 Q152,400 162,400 L740,400 Q750,400 750,392 L750,371"
        stroke="#90A4AE" stroke-width="1.2" fill="none" stroke-dasharray="6,3" marker-end="url(#arr-dash)"/>
  <text x="455" y="413" text-anchor="middle" fill="#90A4AE" font-size="8.5" font-style="italic">param sync</text>

  <!-- ================================================================ -->
  <!-- STEP NUMBERS (circled, on arrows)                                -->
  <!-- ================================================================ -->
  <circle cx="593" cy="214" r="7" fill="#fff" stroke="#78909C" stroke-width="0.8"/>
  <text x="593" y="217" text-anchor="middle" fill="#607D8B" font-size="7" font-weight="bold">1</text>

  <circle cx="283" cy="214" r="7" fill="#fff" stroke="#78909C" stroke-width="0.8"/>
  <text x="283" y="217" text-anchor="middle" fill="#607D8B" font-size="7" font-weight="bold">2</text>

  <circle cx="455" cy="392" r="7" fill="#fff" stroke="#90A4AE" stroke-width="0.8"/>
  <text x="455" y="395" text-anchor="middle" fill="#90A4AE" font-size="7" font-weight="bold">3</text>

  <!-- ================================================================ -->
  <!-- FIGURE CAPTION                                                   -->
  <!-- ================================================================ -->
  <text x="460" y="455" text-anchor="middle" fill="#555" font-size="11.5">
    Figure 1: siirl-agentic Architecture Overview (Disaggregated Mode)
  </text>
</svg>
