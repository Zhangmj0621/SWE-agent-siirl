<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#66BB6A"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#AB47BC"/>
    </marker>
  </defs>
  <rect width="900" height="370" fill="#fff"/>
  <rect x="20" y="10" width="860" height="310" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="860" height="32" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="450" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">SIIRL-Agentic High-Level Architecture</text>

  <!-- ====== Layer 1: All container and component boxes ====== -->

  <!-- Training Layer container -->
  <rect x="30" y="55" width="160" height="130" rx="2" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <rect x="30" y="55" width="160" height="26" rx="2" fill="#C8E6C9" stroke="#81C784" stroke-width="1.2"/>
  <text x="110" y="73" text-anchor="middle" fill="#2E7D32" font-size="13" font-weight="bold">Training Layer</text>

  <!-- Rollout Layer container -->
  <rect x="220" y="55" width="420" height="220" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <rect x="220" y="55" width="420" height="26" rx="2" fill="#BBDEFB" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="430" y="73" text-anchor="middle" fill="#1565C0" font-size="13" font-weight="bold">Rollout Layer</text>

  <!-- Data Layer container -->
  <rect x="670" y="55" width="200" height="130" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <rect x="670" y="55" width="200" height="26" rx="2" fill="#FFECB3" stroke="#FFD54F" stroke-width="1.2"/>
  <text x="770" y="73" text-anchor="middle" fill="#F57F17" font-size="13" font-weight="bold">Data Layer</text>

  <!-- TrainerGroup -->
  <rect x="46" y="97" width="128" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="110" y="116" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">TrainerGroup</text>

  <!-- RolloutManager -->
  <rect x="240" y="100" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="300" y="119" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">RolloutManager</text>

  <!-- SGLang Engines -->
  <rect x="240" y="180" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="300" y="199" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">SGLang Engines</text>

  <!-- Tool calls? diamond replaced with box -->
  <rect x="420" y="152" width="110" height="30" rx="1" fill="#FFFFFF" stroke="#64B5F6" stroke-width="1"/>
  <text x="475" y="171" text-anchor="middle" fill="#424242" font-size="10.5">Tool calls?</text>

  <!-- AIO Tool Env -->
  <rect x="520" y="100" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#E1BEE7" stroke-width="0.8"/>
  <text x="580" y="119" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">AIO Tool Env</text>

  <!-- Reward Compute -->
  <rect x="520" y="180" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="580" y="199" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Reward Compute</text>

  <!-- DataCoordinator -->
  <rect x="700" y="100" width="140" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="770" y="119" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">DataCoordinator</text>

  <!-- ====== Layer 2: All arrows + labels (drawn on top) ====== -->

  <!-- DataCoordinator -> RolloutManager: "prompts" (horizontal) -->
  <rect x="453" y="99" width="42" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="700" y1="115" x2="360" y2="115" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="474" y="109" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">prompts</text>

  <!-- RolloutManager -> SGLang Engines (vertical) -->
  <line x1="300" y1="130" x2="300" y2="180" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- SGLang Engines -> Tool calls? (horizontal at y=195) -->
  <rect x="369" y="182" width="42" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="360" y1="195" x2="420" y2="195" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="390" y="192" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">generate</text>

  <!-- Tool calls? -> AIO Tool Env: "Yes" (horizontal at y=115, from right side) -->
  <rect x="504" y="145" width="22" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 520 167 L 510 167 L 510 115 L 520 115" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="515" y="155" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">Yes</text>

  <!-- AIO Tool Env -> SGLang Engines: "response" (L-path: down then left) -->
  <rect x="413" y="137" width="50" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 580 130 L 580 148 L 360 148 L 360 180" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="438" y="147" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">response</text>

  <!-- Tool calls? -> Reward Compute: "No" (vertical) -->
  <rect x="488" y="196" width="18" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 475 182 L 475 195 L 520 195" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="497" y="206" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">No</text>

  <!-- Reward Compute -> DataCoordinator: "scored samples" (L-path: right then up) -->
  <rect x="676" y="168" width="72" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 640 195 L 770 195 L 770 130" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="712" y="178" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">scored samples</text>

  <!-- DataCoordinator -> TrainerGroup: "training batch" (L-path: top route) -->
  <rect x="365" y="80" width="72" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 700 112 L 650 112 L 650 88 L 110 88 L 110 97" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="401" y="90" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">training batch</text>

  <!-- TrainerGroup -> RolloutManager: "weights" (horizontal at y=112) -->
  <rect x="178" y="99" width="42" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="174" y1="112" x2="240" y2="112" stroke="#66BB6A" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="199" y="109" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">weights</text>

  <!-- Caption -->
  <text x="450" y="355" text-anchor="middle" fill="#555" font-size="10">Figure 1: High-Level Architecture</text>
</svg>
