# pyproject.toml for siirl-agentic

[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siirl-agentic"
dynamic = ["version"]
description = "siirl-agentic: An Asynchronous Multi-Turn Agentic Reinforcement Learning Framework"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shanghai Innovation Institute - AI Infra Team", email = "llm19900326@gmail.com" }]
keywords = ["reinforcement learning", "agentic", "multi-turn", "asynchronous", "rl", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "accelerate>=1.12.0",
    "codetiming>=1.4.0",
    "datasets>=4.4.0",
    "dill>=0.4.0",
    "hydra-core>=1.3.2",
    "numpy>=1.26.4",
    "pandas>=2.3.0",
    "pyarrow>=22.0.0",
    "pybind11>=3.0.0",
    # Distributed
    "ray[default]>=2.53.0",
    # PyTorch
    "torch>=2.8.0",
    "torchdata>=0.11.0",
    "tensordict>=0.10.0",
    # Models
    "transformers>=4.57.0",
    "qwen-vl-utils>=0.0.14",
    "timm>=1.0.16",
    "safetensors>=0.7.0",
    # Logging
    "wandb>=0.23.0",
    "tensorboard>=2.20.0",
    "loguru>=0.7.3",
    # Others
    "scipy>=1.15.0",
    "fastapi>=0.127.0",
    "aiohttp>=3.13.0",
    "packaging>=25.0",
    "sglang>=0.5.5",
    "sglang-router>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.13.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "build>=1.3.0",
    "twine",
    "pre-commit>=3.0.0",
    "py-spy>=0.4.1",
    "ipython>=8.37.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
]
gpu = ["flash-attn>=2.8.2", "triton>=3.4.0"]
sglang-extra = ["sglang[all]>=0.5.5", "torch-memory-saver>=0.0.9"]
all = [
    "flash-attn>=2.8.2",
    "triton>=3.4.0",
    "sglang[all]>=0.5.5",
    "torch-memory-saver>=0.0.9",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/sii-research/siirl-agentic"
Repository = "https://github.com/sii-research/siirl-agentic"
Issues = "https://github.com/sii-research/siirl-agentic/issues"

# ============================================================================
# Tool Configurations
# ============================================================================

[tool.black]
line-length = 140

[tool.isort]
profile = "black"
line_length = 140
known_first_party = ["siirl"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "G",    # flake8-logging-format
]
ignore = [
    "G004",   # logging f-string (loguru style)
    "B005",   # strip with multi-char string (intentional usage)
    "SIM102", # nested if statements (sometimes more readable)
    "SIM105", # contextlib.suppress (explicit try/except is clearer)
    "SIM108", # ternary operator (if-else can be more readable)
    "SIM116", # dict instead of if statements (refactoring)
    "SIM117", # multiple with contexts (nested can be clearer)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405"]
"tests/**/*.py" = ["F401", "F841", "E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
allow_redefinition = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = ["attr-defined", "name-defined", "annotation-unchecked"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = ["-v", "--strict-markers", "--cov=siirl", "--cov-report=term-missing"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "gpu: GPU tests",
]

[tool.coverage.run]
source = ["siirl"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]

[tool.codespell]
skip = "*.git,*.egg-info,build,dist,__pycache__,*.log"
ignore-words-list = "cann,tensor,TE,hsi,nd,thre"

[tool.setuptools]
include-package-data = true
packages = { find = { where = ["."], include = ["siirl*"], exclude = ["tests*"] } }

[tool.setuptools_scm]
write_to = "siirl/_version.py"

[tool.setuptools.package-data]
siirl = ["py.typed", "**/*.yaml", "**/*.yml"]
