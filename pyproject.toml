# ===================================================================
# pyproject.toml for siirl-agentic
#
# PEP 621-compliant configuration file for project metadata,
# build system, and tool configurations. This file provides a
# modern, standardized way to manage Python project configuration.
# ===================================================================


# -------------------------------
# Build System
# -------------------------------
[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools_scm[toml]>=6.2",
    "wheel"
]
build-backend = "setuptools.build_meta"


# -------------------------------
# Project Metadata (PEP 621)
# -------------------------------
[project]
name = "siirl-agentic"
# Version is loaded dynamically from a file. See [tool.setuptools.dynamic].
dynamic = ["version"]

description = "siirl-agentic: An Asynchronous Multi-Turn Agentic Reinforcement Learning Framework"
license = {text = "Apache-2.0"}
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"

# --- Author & URL Information ---
authors = [
  { name = "Shanghai Innovation Institute - AI Infra Team", email = "llm19900326@gmail.com" },
]

# --- Project Discovery ---
keywords = [
    "reinforcement learning",
    "agentic",
    "multi-turn",
    "asynchronous",
    "rl",
    "ai",
    "llm",
    "agent"
]

# Standardized classifiers from https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


# --- Dependencies ---
# Runtime dependencies required by the project.
dependencies = [
    # Core dependencies
    "accelerate",
    "codetiming",
    "datasets>=4.0.0",
    "dill",
    "hydra-core",
    "numpy",
    "pandas",
    "peft",
    "pyarrow>=19.0.0",
    "pybind11",
    "pylatexenc",
    
    # Distributed computing
    "ray[default]>=2.47.1",
    
    # PyTorch ecosystem
    "torch>=2.0.0",
    "torchdata",
    "tensordict>=0.8.0,<=0.9.1,!=0.9.0",
    
    # Transformers and models
    "transformers>=4.30.0",
    "qwen_vl_utils",
    "timm",
    
    # Logging and monitoring
    "wandb",
    "tensorboard",
    "loguru",
    
    # Math and science
    "mathruler",
    "math_verify",
    "math-verify",
    "scipy",
    
    # Web and API
    "fastapi",
    "aiohttp",
    
    # Image processing
    "imageio",
    
    # Utilities
    "packaging>=20.0",
    "dacite",
    
    # SGLang router for agentic workflows
    "sglang-router>=0.2.2",
    
    # Inference engines
    "vllm>=0.8.5.post1",
]


# --- Optional Dependencies ---
# Corresponds to 'extras_require' in setup.py.
# Install with: pip install "siirl-agentic[dev]"
[project.optional-dependencies]
# For core development and releasing
dev = [
    "ruff>=0.13.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "build",
    "twine",
    "pre-commit>=3.0.0",
    "py-spy",
    "ipython",
    "jupyter",
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
    "pre-commit>=3.0.0",
    "py-spy",
]

# GPU-specific optimizations
gpu = [
    "liger-kernel",
    "flash-attn>=2.4.0",
    "triton>=2.1.0",
]

# SGLang-based async inference
sglang = [
    "sglang[all]>=0.4.6.post5",
    "torch-memory-saver>=0.0.5",
]

# Geometry and specialized math tasks
geo = [
    "mathruler",
]

# Full installation with all optional dependencies
all = [
    "liger-kernel",
    "flash-attn>=2.4.0",
    "triton>=2.1.0",
    "sglang[all]>=0.4.6.post5",
    "torch-memory-saver>=0.0.5",
    "mathruler",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]


# --- Project URLs ---
# This table should only contain string key-value pairs for URLs.
[project.urls]
"Homepage" = "https://github.com/sii-research/siirl-agentic"
"Bug Tracker" = "https://github.com/sii-research/siirl-agentic/issues"
"Repository" = "https://github.com/sii-research/siirl-agentic"
"Documentation" = "https://siirl-agentic.readthedocs.io"


# -------------------------------
# Tool: Black (Code Formatting)
# -------------------------------
[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''


# -------------------------------
# Tool: isort (Import Sorting)
# -------------------------------
[tool.isort]
profile = "black"
line_length = 100
py_version = 310
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
known_first_party = ["siirl"]
known_third_party = ["ray", "transformers", "torch", "numpy", "wandb", "loguru"]
src_paths = ["siirl", "tests"]
skip_glob = ["docs/*", "build/*", "dist/*", "*.egg-info"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true


# -------------------------------
# Tool: Ruff (Linting & Formatting)
# -------------------------------
[tool.ruff]
line-length = 140  # Balanced: stricter than slime(320), more practical than 100/120
target-version = "py310"

# Exclude specific files/directories from analysis
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "docs",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    # "I",    # isort - disabled to avoid conflicts with standalone isort hook
    "G",      # flake8-logging-format
]

# Ignore specific rules - only truly necessary exceptions
ignore = [
    "F405",   # Star imports (may be undefined) - used in __init__.py
    "F403",   # Star imports (unable to detect undefined names) - used in __init__.py
    "E731",   # Lambda assignment - sometimes necessary for concise code
    "B007",   # Loop control variable not used - intentional in some cases
    "UP032",  # f-string format - compatibility consideration
    "UP035",  # Deprecated typing imports - Python 3.10+ supports both, gradual migration
    "G004",   # Logging statement uses f-string - preferred logging style
    "B005",   # Strip with multi-char string - behavior is intentional
]

# Configure isort within ruff
[tool.ruff.lint.isort]
known-first-party = ["siirl"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# Configure per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405"]  # Allow unused imports in __init__.py
"tests/**/*.py" = ["F401", "F841"]  # Allow unused variables in tests
# SWE agentflow is third-party code from external project
"siirl/execution/rollout/agentflow/swe/**/*.py" = ["E501", "B006", "B008", "B904", "B017", "B018"]


# -------------------------------
# Tool: pytest (Testing)
# -------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Add verbose output and show durations
addopts = [
    "--verbose",
    "--strict-markers",
    "--strict-config",
    "--durations=10",
    "--cov=siirl",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

# Directories to ignore when discovering tests
norecursedirs = [
    ".*",
    "build",
    "dist",
    "CVS",
    "_darcs",
    "{arch}",
    "*.egg",
    "venv",
    "env",
    "virtualenv",
    "docs",
    "examples",
    "scripts",
]

# Test markers for organizing tests
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for component interactions",
    "e2e: End-to-end tests for complete workflows",
    "slow: Tests that take a long time to run",
    "gpu: Tests that require GPU",
    "async: Tests for async functionality",
    "skipci: Skip during continuous integration",
]

# Asyncio configuration
asyncio_mode = "auto"

# Timeout for tests (in seconds)
timeout = 300


# -------------------------------
# Tool: Coverage (Test Coverage)
# -------------------------------
[tool.coverage.run]
source = ["siirl"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/setup.py",
]
parallel = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]


# -------------------------------
# Tool: codespell (Spell Checking)
# -------------------------------
[tool.codespell]
skip = "*.git,*.egg-info,*.pyc,*.pdf,*.png,*.jpg,*.jpeg,*.svg,build,dist,__pycache__,*.log"
ignore-words-list = "cann,tensor,TE,hsi,nd,thre"
count = true
quiet-level = 3


# -------------------------------
# Tool: mypy (Type Checking)
# -------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
show_error_codes = true
pretty = true
follow_imports = "skip"

# Per-module options
[[tool.mypy.overrides]]
module = [
    "siirl.algorithm.*",
    "siirl.utils.reward_score.*",
]
ignore_errors = true


# -------------------------------
# Tool: Setuptools
# -------------------------------
[tool.setuptools]
include-package-data = true
# Modern equivalent of find_packages()
packages = { find = { where = ["."], include = ["siirl*"], exclude = ["tests*"] } }

[tool.setuptools_scm]
write_to = "siirl/_version.py"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
siirl = [
    "py.typed",
    "**/*.yaml",
    "**/*.yml",
    "execution/rollout/agentflow/**/*.yaml",
]


# -------------------------------
# Tool: bandit (Security Linting)
# -------------------------------
[tool.bandit]
exclude_dirs = ["tests", "scripts", "docs", "build", "dist"]
skips = ["B101", "B601"]  # Skip assert_used and paramiko_calls


# -------------------------------
# Tool: pylint (Additional Linting)
# -------------------------------
[tool.pylint.main]
py-version = "3.10"
ignore = ["tests", "docs", "build", "dist", ".git", "__pycache__"]
jobs = 0  # Use all available CPUs

[tool.pylint.messages_control]
disable = [
    "C0103",  # Invalid name
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0913",  # Too many arguments
    "R0914",  # Too many local variables
    "W0212",  # Access to protected member
]

[tool.pylint.format]
max-line-length = 100
