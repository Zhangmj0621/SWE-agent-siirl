<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#66BB6A"/>
    </marker>
  </defs>
  <rect width="800" height="360" fill="#fff"/>
  <rect x="20" y="10" width="760" height="300" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="760" height="28" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="29" text-anchor="middle" fill="#222" font-size="13" font-weight="bold" letter-spacing="0.3">Weight Synchronization</text>

  <!-- Training Cluster container (x=40, y=80, w=250, h=180) -->
  <rect x="40" y="80" width="250" height="180" rx="2" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <rect x="40" y="80" width="250" height="26" rx="2" fill="#C8E6C9" stroke="#81C784" stroke-width="1.2"/>
  <text x="165" y="98" text-anchor="middle" fill="#2E7D32" font-size="13" font-weight="bold">Training Cluster</text>

  <!-- Rollout Cluster container (x=510, y=80, w=250, h=180) -->
  <rect x="510" y="80" width="250" height="180" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <rect x="510" y="80" width="250" height="26" rx="2" fill="#BBDEFB" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="635" y="98" text-anchor="middle" fill="#1565C0" font-size="13" font-weight="bold">Rollout Cluster</text>

  <!-- Layer 1: All boxes -->
  <rect x="60" y="125" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#81C784" stroke-width="0.8"/>
  <text x="120" y="144" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">Actor Model</text>
  <rect x="60" y="170" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="120" y="189" text-anchor="middle" fill="#424242" font-size="12">Optimizer</text>
  <rect x="60" y="215" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="120" y="234" text-anchor="middle" fill="#424242" font-size="12">Gradients</text>
  <rect x="340" y="145" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#FFB74D" stroke-width="0.8"/>
  <text x="400" y="164" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">sync_weights()</text>
  <rect x="530" y="125" width="140" height="30" rx="1" fill="#FFFFFF" stroke="#64B5F6" stroke-width="0.8"/>
  <text x="600" y="144" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">Inference Model</text>
  <rect x="530" y="170" width="140" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="600" y="189" text-anchor="middle" fill="#424242" font-size="12">SGLang Engine</text>

  <!-- Layer 2: All arrows + labels (orthogonal, with bg rects) -->
  <!-- Optimizer -> Actor Model (vertical, upward) -->
  <line x1="120" y1="170" x2="120" y2="155" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="125" y="155" width="34" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="142" y="165" fill="#607D8B" font-size="10" font-style="italic">update</text>

  <!-- Actor Model -> sync_weights(): orthogonal L-path (right then down) -->
  <path d="M 180 140 L 260 140 L 260 160 L 340 160" stroke="#66BB6A" stroke-width="1.2" fill="none" marker-end="url(#arr-g)"/>
  <rect x="237" y="132" width="38" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="256" y="142" text-anchor="middle" fill="#607D8B" font-size="10" font-style="italic">params</text>

  <!-- sync_weights() -> Inference Model: orthogonal L-path (right then up) -->
  <path d="M 460 160 L 500 160 L 500 140 L 530 140" stroke="#66BB6A" stroke-width="1.2" fill="none" marker-end="url(#arr-g)"/>
  <rect x="473" y="132" width="50" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="498" y="142" text-anchor="middle" fill="#607D8B" font-size="10" font-style="italic">broadcast</text>

  <!-- Inference Model -> SGLang Engine (vertical, downward) -->
  <line x1="600" y1="155" x2="600" y2="170" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Caption -->
  <text x="400" y="345" text-anchor="middle" fill="#555" font-size="10">Figure 4: How model weights are synced between clusters</text>
</svg>
