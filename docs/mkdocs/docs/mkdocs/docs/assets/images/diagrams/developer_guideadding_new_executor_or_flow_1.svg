<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
    <marker id="arr-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#90A4AE"/>
    </marker>
    <marker id="seq-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#fff"/>
  <rect x="20" y="10" width="860" height="560" rx="0" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="20" y="10" width="860" height="32" rx="0" fill="#F8F9FA" stroke="#333333" stroke-width="1.5"/>
  <text x="450.0" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">AgentFlow Class Diagram</text>
  <rect x="50" y="60" width="260" height="102" rx="2" fill="#FFFFFF" stroke="#64B5F6" stroke-width="1.2"/>
  <rect x="50" y="60" width="260" height="38" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="180.0" y="74" text-anchor="middle" fill="#1565C0" font-size="9" font-style="italic">&lt;&lt;Protocol&gt;&gt;</text>
  <text x="180.0" y="90" text-anchor="middle" fill="#1565C0" font-size="12" font-weight="bold">AgentFlow</text>
  <line x1="50" y1="98" x2="310" y2="98" stroke="#64B5F6" stroke-width="0.8"/>
  <text x="58" y="114" text-anchor="start" fill="#424242" font-size="10">+preprocess(sample: dict) → Sample</text>
  <text x="58" y="132" text-anchor="start" fill="#424242" font-size="10">+generate(sample: Sample)*</text>
  <text x="58" y="150" text-anchor="start" fill="#424242" font-size="10">+reward(sample: Sample)*</text>
  <rect x="380" y="60" width="280" height="218" rx="2" fill="#FFFFFF" stroke="#81C784" stroke-width="1.2"/>
  <rect x="380" y="60" width="280" height="28" rx="2" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <text x="520.0" y="74" text-anchor="middle" fill="#2E7D32" font-size="12" font-weight="bold">Sample&lt;AgentMeta&gt;</text>
  <line x1="380" y1="88" x2="660" y2="88" stroke="#81C784" stroke-width="0.8"/>
  <text x="388" y="104" text-anchor="start" fill="#424242" font-size="10">+m: AgentMeta</text>
  <text x="388" y="122" text-anchor="start" fill="#424242" font-size="10">+model: Model</text>
  <text x="388" y="140" text-anchor="start" fill="#424242" font-size="10">+status: Status</text>
  <text x="388" y="158" text-anchor="start" fill="#424242" font-size="10">+tokens: list[int]</text>
  <text x="388" y="176" text-anchor="start" fill="#424242" font-size="10">+loss_mask: list[int]</text>
  <text x="388" y="194" text-anchor="start" fill="#424242" font-size="10">+rollout_log_probs: list[float]</text>
  <text x="388" y="212" text-anchor="start" fill="#424242" font-size="10">+conversations: list[dict]</text>
  <text x="388" y="230" text-anchor="start" fill="#424242" font-size="10">+reward: float | None</text>
  <text x="388" y="248" text-anchor="start" fill="#424242" font-size="10">+append_input_tokens(tokens)</text>
  <text x="388" y="266" text-anchor="start" fill="#424242" font-size="10">+add_message(role, content)</text>
  <rect x="50" y="350" width="260" height="92" rx="2" fill="#FFFFFF" stroke="#FFD54F" stroke-width="1.2"/>
  <rect x="50" y="350" width="260" height="28" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <text x="180.0" y="364" text-anchor="middle" fill="#F57F17" font-size="12" font-weight="bold">Model</text>
  <line x1="50" y1="378" x2="310" y2="378" stroke="#FFD54F" stroke-width="0.8"/>
  <text x="58" y="394" text-anchor="start" fill="#424242" font-size="10">+tokenizer: Tokenizer</text>
  <text x="58" y="412" text-anchor="start" fill="#424242" font-size="10">+query(input_tokens, messages)</text>
  <text x="58" y="430" text-anchor="start" fill="#424242" font-size="10">  → ModelResponse</text>
  <rect x="550" y="350" width="200" height="156" rx="2" fill="#FFFFFF" stroke="#CE93D8" stroke-width="1.2"/>
  <rect x="550" y="350" width="200" height="38" rx="2" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.2"/>
  <text x="650.0" y="364" text-anchor="middle" fill="#7B1FA2" font-size="9" font-style="italic">&lt;&lt;enumeration&gt;&gt;</text>
  <text x="650.0" y="380" text-anchor="middle" fill="#7B1FA2" font-size="12" font-weight="bold">Status</text>
  <line x1="550" y1="388" x2="750" y2="388" stroke="#CE93D8" stroke-width="0.8"/>
  <text x="558" y="404" text-anchor="start" fill="#424242" font-size="10">PENDING</text>
  <text x="558" y="422" text-anchor="start" fill="#424242" font-size="10">ROLLEDOUT</text>
  <text x="558" y="440" text-anchor="start" fill="#424242" font-size="10">COMPLETED</text>
  <text x="558" y="458" text-anchor="start" fill="#424242" font-size="10">TRUNCATED</text>
  <text x="558" y="476" text-anchor="start" fill="#424242" font-size="10">ABORTED</text>
  <text x="558" y="494" text-anchor="start" fill="#424242" font-size="10">FAILED</text>
  <line x1="310" y1="111.0" x2="380" y2="169.0" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="345.0" y="134.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">produces &amp; consumes</text>
  <line x1="180.0" y1="162" x2="180.0" y2="350" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="180.0" y="250.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">uses for inference</text>
  <line x1="520.0" y1="278" x2="650.0" y2="350" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="585.0" y="308.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">tracks lifecycle</text>
  <path d="M520.0,278 L520,340 L280,340 L180.0,350" fill="none" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="280" y="334" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">holds reference</text>
  <text x="450.0" y="605" text-anchor="middle" fill="#555" font-size="10">Figure 1: AgentFlow Core Classes</text>
</svg>
