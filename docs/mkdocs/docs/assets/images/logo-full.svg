<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="lgm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="lgt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="lgw" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <marker id="fa1" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#818cf8"/>
    </marker>
    <marker id="fa2" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#6366f1"/>
    </marker>
    <marker id="fat" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#14b8a6"/>
    </marker>
  </defs>

  <!-- ========== Left: Logo Icon (scaled to fit ~180x180 area, centered at 100,100) ========== -->
  <g transform="translate(100, 100) scale(0.34)">
    <!-- Background glow -->
    <circle cx="0" cy="0" r="200" fill="url(#lgw)"/>

    <!-- Outer hexagon -->
    <polygon
      points="0,-200 173,-100 173,100 0,200 -173,100 -173,-100"
      fill="none"
      stroke="url(#lgm)"
      stroke-width="6"
      stroke-linejoin="round"
      opacity="0.35"
    />

    <!-- Orbiting arc 1 -->
    <path
      d="M 84,-126 A 160,160 0 0,1 154,24"
      fill="none"
      stroke="#818cf8"
      stroke-width="5"
      stroke-linecap="round"
      marker-end="url(#fa1)"
      opacity="0.8"
    />

    <!-- Orbiting arc 2 -->
    <path
      d="M 114,84 A 160,160 0 0,1 -86,144"
      fill="none"
      stroke="#6366f1"
      stroke-width="5"
      stroke-linecap="round"
      marker-end="url(#fa2)"
      opacity="0.7"
    />

    <!-- Orbiting arc 3 -->
    <path
      d="M -126,104 A 160,160 0 0,1 -136,-86"
      fill="none"
      stroke="#14b8a6"
      stroke-width="5"
      stroke-linecap="round"
      marker-end="url(#fat)"
      opacity="0.7"
    />

    <!-- Center agent node -->
    <circle cx="0" cy="0" r="36" fill="url(#lgm)" opacity="0.95"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
    <!-- Brain pattern -->
    <circle cx="-8" cy="-8" r="4" fill="#ffffff" opacity="0.85"/>
    <circle cx="8" cy="-8" r="4" fill="#ffffff" opacity="0.85"/>
    <circle cx="0" cy="8" r="4" fill="#ffffff" opacity="0.85"/>
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <line x1="-8" y1="-8" x2="0" y2="8" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <line x1="8" y1="-8" x2="0" y2="8" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

    <!-- Satellite node top -->
    <line x1="0" y1="-36" x2="0" y2="-88" stroke="url(#lgm)" stroke-width="3" opacity="0.6"/>
    <circle cx="0" cy="-98" r="16" fill="url(#lgm)" opacity="0.7"/>
    <circle cx="0" cy="-98" r="8" fill="#ffffff" opacity="0.5"/>

    <!-- Satellite node bottom-right -->
    <line x1="24" y1="18" x2="74" y2="62" stroke="url(#lgm)" stroke-width="3" opacity="0.6"/>
    <circle cx="84" cy="70" r="16" fill="url(#lgm)" opacity="0.7"/>
    <circle cx="84" cy="70" r="8" fill="#ffffff" opacity="0.5"/>

    <!-- Satellite node bottom-left -->
    <line x1="-24" y1="18" x2="-74" y2="62" stroke="url(#lgm)" stroke-width="3" opacity="0.6"/>
    <circle cx="-84" cy="70" r="16" fill="url(#lgm)" opacity="0.7"/>
    <circle cx="-84" cy="70" r="8" fill="#ffffff" opacity="0.5"/>

    <!-- Gear element -->
    <g transform="translate(114, -136)" opacity="0.85">
      <circle cx="0" cy="0" r="18" fill="url(#lgt)" opacity="0.9"/>
      <rect x="-3" y="-26" width="6" height="10" rx="2" fill="#14b8a6"/>
      <rect x="-3" y="16" width="6" height="10" rx="2" fill="#14b8a6"/>
      <rect x="-26" y="-3" width="10" height="6" rx="2" fill="#14b8a6"/>
      <rect x="16" y="-3" width="10" height="6" rx="2" fill="#14b8a6"/>
      <rect x="11" y="-22" width="6" height="10" rx="2" fill="#14b8a6" transform="rotate(45, 14, -17)"/>
      <rect x="-17" y="12" width="6" height="10" rx="2" fill="#14b8a6" transform="rotate(45, -14, 17)"/>
      <rect x="-22" y="-17" width="10" height="6" rx="2" fill="#14b8a6" transform="rotate(45, -17, -14)"/>
      <rect x="12" y="11" width="10" height="6" rx="2" fill="#14b8a6" transform="rotate(45, 17, 14)"/>
      <circle cx="0" cy="0" r="7" fill="#ffffff" opacity="0.4"/>
    </g>

    <!-- Dashed line from gear to center -->
    <line x1="99" y1="-121" x2="24" y2="-56" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
  </g>

  <!-- ========== Right: Text ========== -->
  <!-- Main title -->
  <text
    x="230"
    y="105"
    font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="56"
    fill="#ffffff"
    letter-spacing="-1"
  >siirl-agentic</text>

  <!-- Subtitle -->
  <text
    x="232"
    y="140"
    font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-weight="400"
    font-size="20"
    fill="#ffffff"
    opacity="0.7"
    letter-spacing="0.5"
  >Async Agentic RL Framework</text>
</svg>
