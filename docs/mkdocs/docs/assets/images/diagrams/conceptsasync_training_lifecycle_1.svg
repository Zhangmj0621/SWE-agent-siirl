<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#fff"/>
  <rect x="20" y="10" width="760" height="240" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="760" height="28" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="29" text-anchor="middle" fill="#222" font-size="13" font-weight="bold" letter-spacing="0.3">Async Training Lifecycle</text>

  <!-- Layer 1: All boxes -->
  <rect x="40" y="120" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="0.8"/>
  <text x="90" y="139" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">Initialize</text>
  <rect x="180" y="120" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="230" y="139" text-anchor="middle" fill="#424242" font-size="12">Rollout</text>
  <rect x="320" y="120" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="370" y="139" text-anchor="middle" fill="#424242" font-size="12">Collect</text>
  <rect x="460" y="120" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="510" y="139" text-anchor="middle" fill="#424242" font-size="12">Train</text>
  <rect x="600" y="120" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#FFCC80" stroke-width="0.8"/>
  <text x="650" y="139" text-anchor="middle" fill="#424242" font-size="12">Sync</text>

  <!-- Layer 2: All arrows + labels -->
  <!-- Forward arrows -->
  <line x1="140" y1="135" x2="180" y2="135" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="280" y1="135" x2="320" y2="135" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="420" y1="135" x2="460" y2="135" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="560" y1="135" x2="600" y2="135" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Loop-back arrow: Sync -> Rollout (orthogonal L-path) -->
  <path d="M 650 120 L 650 100 L 230 100 L 230 120" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <!-- Loop label with bg rect -->
  <rect x="428" y="91" width="24" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="440" y="101" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">loop</text>

  <!-- Caption -->
  <text x="400" y="285" text-anchor="middle" fill="#555" font-size="10">Figure 1: States in the async training loop</text>
</svg>
