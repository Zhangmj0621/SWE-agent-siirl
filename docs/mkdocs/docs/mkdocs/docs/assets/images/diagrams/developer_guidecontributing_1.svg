<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 760" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
    <marker id="arr-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#90A4AE"/>
    </marker>
    <marker id="seq-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="860" height="760" fill="#fff"/>
  <rect x="20" y="10" width="820" height="700" rx="0" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="20" y="10" width="820" height="32" rx="0" fill="#F8F9FA" stroke="#333333" stroke-width="1.5"/>
  <text x="430.0" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">Contribution Workflow</text>
  <rect x="290" y="52" width="280" height="160" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="430.0" y="68" text-anchor="middle" fill="#1565C0" font-size="13" font-weight="bold">1. Prepare</text>
  <rect x="290" y="240" width="280" height="160" rx="2" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <text x="430.0" y="256" text-anchor="middle" fill="#2E7D32" font-size="13" font-weight="bold">2. Validate</text>
  <rect x="290" y="428" width="280" height="130" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <text x="430.0" y="444" text-anchor="middle" fill="#F57F17" font-size="13" font-weight="bold">3. Submit</text>
  <rect x="245" y="586" width="370" height="110" rx="2" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.2"/>
  <text x="430.0" y="602" text-anchor="middle" fill="#7B1FA2" font-size="13" font-weight="bold">4. Review</text>
  <rect x="306" y="94" width="248" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="430.0" y="113.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Fork repository</text>
  <rect x="306" y="134" width="248" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="430.0" y="153.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Create feature branch</text>
  <rect x="306" y="174" width="248" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="430.0" y="193.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Implement changes</text>
  <rect x="306" y="282" width="248" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="430.0" y="301.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Run pre-commit hooks</text>
  <rect x="306" y="322" width="248" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="430.0" y="341.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Run pytest</text>
  <rect x="306" y="362" width="248" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="430.0" y="381.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Update documentation</text>
  <rect x="306" y="470" width="248" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="430.0" y="489.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Write clear commit message</text>
  <rect x="306" y="510" width="248" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="430.0" y="529.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Push to fork → Open PR</text>
  <rect x="265" y="630" width="160" height="30" rx="1" fill="#FFFFFF" stroke="#E1BEE7" stroke-width="0.8"/>
  <text x="345.0" y="649.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Automated checks</text>
  <rect x="435" y="630" width="160" height="30" rx="1" fill="#FFFFFF" stroke="#E1BEE7" stroke-width="0.8"/>
  <text x="515.0" y="649.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Code review</text>
  <polygon points="427.0,700 449,722.0 427.0,744 405,722.0" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1"/>
  <text x="427.0" y="726.0" text-anchor="middle" fill="#424242" font-size="10.5">OK?</text>
  <rect x="520" y="700" width="140" height="30" rx="1" fill="#FFFFFF" stroke="#81C784" stroke-width="0.8"/>
  <text x="590.0" y="719.0" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">Merge to master</text>
  <line x1="430.0" y1="124" x2="430.0" y2="134" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="430.0" y="123.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">git fork</text>
  <line x1="430.0" y1="164" x2="430.0" y2="174" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="430.0" y="163.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">checkout -b</text>
  <line x1="430.0" y1="204" x2="430.0" y2="282" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="430.0" y="237.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">code ready</text>
  <line x1="430.0" y1="312" x2="430.0" y2="322" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="430.0" y="311.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">all pass</text>
  <line x1="430.0" y1="352" x2="430.0" y2="362" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="430.0" y="351.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">tests pass</text>
  <line x1="430.0" y1="392" x2="430.0" y2="470" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="430.0" y="425.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">docs updated</text>
  <line x1="430.0" y1="500" x2="430.0" y2="510" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="430.0" y1="540" x2="345.0" y2="630" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="387.5" y="579.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">PR created</text>
  <line x1="425" y1="645.0" x2="435" y2="645.0" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="515.0" y1="660" x2="427.0" y2="700" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M405,722.0 L240,722 L240,150 L306,189.0" fill="none" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="240" y="144" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">Changes requested</text>
  <line x1="449" y1="722.0" x2="520" y2="715.0" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="484.5" y="712.5" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">Approved</text>
  <text x="430.0" y="745" text-anchor="middle" fill="#555" font-size="10">Figure 1: Contributing Workflow</text>
</svg>
