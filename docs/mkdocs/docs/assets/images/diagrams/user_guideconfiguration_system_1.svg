<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="800" height="520" fill="#fff"/>
  <rect x="20" y="10" width="760" height="460" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="760" height="28" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="29" text-anchor="middle" fill="#222" font-size="13" font-weight="bold" letter-spacing="0.3">Configuration System</text>

  <!-- Layer 1: All boxes -->
  <!-- Root: TrainConfig -->
  <rect x="310" y="60" width="180" height="36" rx="1" fill="#FFF" stroke="#BDBDBD" stroke-width="1.0"/>
  <text x="400" y="83" text-anchor="middle" fill="#424242" font-size="12" font-weight="600">TrainConfig</text>

  <!-- Level 2: 4 sub-configs evenly distributed -->
  <!-- container inner: x=50..750, span=700; 4 boxes w=150, gap=(700-600)/3=33.3 -->
  <!-- x: 50, 233, 417, 600 -->
  <rect x="50" y="170" width="150" height="30" rx="1" fill="#FFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="125" y="189" text-anchor="middle" fill="#424242" font-size="11">ModelConfig</text>
  <rect x="233" y="170" width="150" height="30" rx="1" fill="#FFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="308" y="189" text-anchor="middle" fill="#424242" font-size="11">RolloutConfig</text>
  <rect x="417" y="170" width="150" height="30" rx="1" fill="#FFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="492" y="189" text-anchor="middle" fill="#424242" font-size="11">DataConfig</text>
  <rect x="600" y="170" width="150" height="30" rx="1" fill="#FFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="675" y="189" text-anchor="middle" fill="#424242" font-size="11">TrainerConfig</text>

  <!-- Level 3: Sub-sub configs under ModelConfig -->
  <rect x="50" y="270" width="130" height="28" rx="1" fill="#FFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="115" y="288" text-anchor="middle" fill="#424242" font-size="11">ActorConfig</text>
  <rect x="50" y="316" width="130" height="28" rx="1" fill="#FFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="115" y="334" text-anchor="middle" fill="#424242" font-size="11">CriticConfig</text>

  <!-- Level 3: Sub-sub configs under RolloutConfig -->
  <rect x="233" y="270" width="130" height="28" rx="1" fill="#FFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="298" y="288" text-anchor="middle" fill="#424242" font-size="11">SGLangConfig</text>
  <rect x="233" y="316" width="130" height="28" rx="1" fill="#FFF" stroke="#E1BEE7" stroke-width="0.8"/>
  <text x="298" y="334" text-anchor="middle" fill="#424242" font-size="11">ToolConfig</text>

  <!-- Layer 2: All arrows (orthogonal tree routing) -->

  <!-- TrainConfig -> 4 children: vertical down from center, then horizontal fork, then vertical down to each child -->
  <!-- TrainConfig center bottom: (400, 96) -->
  <!-- Fork line at y=135 -->
  <line x1="400" y1="96" x2="400" y2="135" stroke="#78909C" stroke-width="1.2"/>
  <!-- Horizontal fork line from x=125 to x=675 at y=135 -->
  <line x1="125" y1="135" x2="675" y2="135" stroke="#78909C" stroke-width="1.2"/>
  <!-- Vertical drops to each child -->
  <line x1="125" y1="135" x2="125" y2="170" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="308" y1="135" x2="308" y2="170" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="492" y1="135" x2="492" y2="170" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="675" y1="135" x2="675" y2="170" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ModelConfig -> 2 children: vertical down to ActorConfig, then ActorConfig to CriticConfig -->
  <!-- ModelConfig center bottom: (125, 200) -->
  <line x1="115" y1="200" x2="115" y2="270" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="115" y1="298" x2="115" y2="316" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- RolloutConfig -> 2 children -->
  <!-- RolloutConfig center bottom: (308, 200) -->
  <line x1="298" y1="200" x2="298" y2="270" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="298" y1="298" x2="298" y2="316" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Caption -->
  <text x="400" y="505" text-anchor="middle" fill="#555" font-size="10">Figure 1: Hierarchical configuration structure</text>
</svg>
