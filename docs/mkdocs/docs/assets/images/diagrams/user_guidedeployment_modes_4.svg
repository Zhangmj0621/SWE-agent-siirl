<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#fff"/>
  <rect x="20" y="10" width="760" height="390" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="760" height="32" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">Deployment Startup Sequence</text>

  <!-- Vertical lifelines -->
  <line x1="60" y1="60" x2="60" y2="370" stroke="#E0E0E0" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="240" y1="60" x2="240" y2="370" stroke="#E0E0E0" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="420" y1="60" x2="420" y2="370" stroke="#E0E0E0" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="600" y1="60" x2="600" y2="370" stroke="#E0E0E0" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Lifeline labels -->
  <text x="60" y="75" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">MainRunner</text>
  <text x="240" y="75" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">Ray</text>
  <text x="420" y="75" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">TrainerGroup</text>
  <text x="600" y="75" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">RolloutManager</text>

  <!-- Layer 1: All arrows -->
  <!-- Step 1: ray.init() -->
  <line x1="60" y1="110" x2="240" y2="110" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Step 2: spawn TrainerGroup -->
  <line x1="240" y1="150" x2="420" y2="150" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Step 3: spawn RolloutManager -->
  <line x1="240" y1="190" x2="600" y2="190" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Step 4: register_weights() -->
  <line x1="420" y1="230" x2="600" y2="230" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Step 5: ready() -->
  <line x1="600" y1="270" x2="420" y2="270" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Step 6: start_training() -->
  <line x1="60" y1="310" x2="420" y2="310" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Layer 2: All bg rects + labels (on top of arrows) -->
  <!-- Label: ray.init() -->
  <rect x="115" y="97" width="50" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="140" y="107" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">ray.init()</text>
  <!-- Label: spawn TrainerGroup -->
  <rect x="275" y="137" width="90" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="320" y="147" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">spawn TrainerGroup</text>
  <!-- Label: spawn RolloutManager -->
  <rect x="360" y="177" width="100" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="410" y="187" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">spawn RolloutManager</text>
  <!-- Label: register_weights() -->
  <rect x="464" y="217" width="82" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="505" y="227" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">register_weights()</text>
  <!-- Label: ready() -->
  <rect x="484" y="257" width="42" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="505" y="267" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">ready()</text>
  <!-- Label: start_training() -->
  <rect x="192" y="297" width="76" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="230" y="307" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">start_training()</text>

  <!-- Caption -->
  <text x="400" y="435" text-anchor="middle" fill="#555" font-size="10">Figure 4: Order of component initialization</text>
</svg>
