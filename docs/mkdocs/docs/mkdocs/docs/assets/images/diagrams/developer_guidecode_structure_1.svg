<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 680" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
    <marker id="arr-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#90A4AE"/>
    </marker>
    <marker id="seq-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="860" height="680" fill="#fff"/>
  <rect x="20" y="10" width="820" height="620" rx="0" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="20" y="10" width="820" height="32" rx="0" fill="#F8F9FA" stroke="#333333" stroke-width="1.5"/>
  <text x="430.0" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">Training Step Call Graph</text>
  <rect x="300" y="52" width="260" height="68" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.2"/>
  <text x="430.0" y="68" text-anchor="middle" fill="#616161" font-size="13" font-weight="bold">MainRunner</text>
  <rect x="50" y="150" width="760" height="340" rx="2" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <text x="430.0" y="166" text-anchor="middle" fill="#2E7D32" font-size="13" font-weight="bold">Training Step</text>
  <rect x="300" y="530" width="260" height="68" rx="2" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.2"/>
  <text x="430.0" y="546" text-anchor="middle" fill="#E65100" font-size="13" font-weight="bold">Reporting</text>
  <rect x="316" y="94" width="228" height="30" rx="1" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="0.8"/>
  <text x="430.0" y="113.0" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">MainRunner.run()</text>
  <rect x="330" y="195" width="200" height="30" rx="1" fill="#FFFFFF" stroke="#81C784" stroke-width="0.8"/>
  <text x="430.0" y="214.0" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">TrainerGroup.train()</text>
  <rect x="68" y="260" width="210" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="173.0" y="279.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">DataCoordinator.get()</text>
  <rect x="325" y="260" width="200" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="425.0" y="279.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Actor.forward()</text>
  <rect x="575" y="260" width="210" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="680.0" y="279.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Critic.forward()</text>
  <rect x="325" y="325" width="200" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="425.0" y="344.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">compute_advantage()</text>
  <rect x="325" y="390" width="200" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="425.0" y="409.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">compute_loss()</text>
  <rect x="325" y="455" width="200" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="425.0" y="474.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Actor.backward()</text>
  <rect x="316" y="572" width="228" height="30" rx="1" fill="#FFFFFF" stroke="#FFCC80" stroke-width="0.8"/>
