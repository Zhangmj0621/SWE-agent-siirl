<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#66BB6A"/>
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#FFB300"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#AB47BC"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="#fff"/>
  <rect x="20" y="10" width="860" height="640" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="860" height="28" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="450" y="29" text-anchor="middle" fill="#222" font-size="13" font-weight="bold" letter-spacing="0.3">MPMD Async Execution Engine</text>

  <!-- Layer 1: All containers and boxes -->

  <!-- MainRunner (Driver) -->
  <rect x="30" y="55" width="180" height="140" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.2"/>
  <rect x="30" y="55" width="180" height="26" rx="2" fill="#EEEEEE" stroke="#BDBDBD" stroke-width="1.2"/>
  <text x="120" y="73" text-anchor="middle" fill="#616161" font-size="13" font-weight="bold">MainRunner</text>
  <rect x="60" y="96" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8"/>
  <text x="120" y="115" text-anchor="middle" fill="#424242" font-size="12">Parse Config</text>
  <rect x="60" y="141" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8"/>
  <text x="120" y="160" text-anchor="middle" fill="#424242" font-size="12">Allocate Resources</text>

  <!-- TrainerGroup -->
  <rect x="240" y="55" width="280" height="140" rx="2" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <rect x="240" y="55" width="280" height="26" rx="2" fill="#C8E6C9" stroke="#81C784" stroke-width="1.2"/>
  <text x="380" y="73" text-anchor="middle" fill="#2E7D32" font-size="13" font-weight="bold">TrainerGroup (Training GPUs)</text>
  <rect x="260" y="96" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="320" y="115" text-anchor="middle" fill="#424242" font-size="12">Trainer Actor 1</text>
  <rect x="380" y="96" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="440" y="115" text-anchor="middle" fill="#424242" font-size="12">Trainer Actor N</text>
  <rect x="260" y="141" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="320" y="160" text-anchor="middle" fill="#424242" font-size="12">Critic Model</text>

  <!-- Monitoring -->
  <rect x="550" y="55" width="320" height="90" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.2"/>
  <rect x="550" y="55" width="320" height="26" rx="2" fill="#EEEEEE" stroke="#BDBDBD" stroke-width="1.2"/>
  <text x="710" y="73" text-anchor="middle" fill="#616161" font-size="13" font-weight="bold">Monitoring</text>
  <rect x="570" y="96" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8"/>
  <text x="630" y="115" text-anchor="middle" fill="#424242" font-size="12">MetricWorker</text>
  <rect x="730" y="96" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8"/>
  <text x="790" y="115" text-anchor="middle" fill="#424242" font-size="12">ValidateMonitor</text>

  <!-- RolloutManager -->
  <rect x="30" y="230" width="580" height="190" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <rect x="30" y="230" width="580" height="26" rx="2" fill="#BBDEFB" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="320" y="248" text-anchor="middle" fill="#1565C0" font-size="13" font-weight="bold">RolloutManager (Rollout GPUs)</text>
  <!-- 4 boxes w=130, inner 45..595, span=550, gap=10 -->
  <rect x="45" y="271" width="130" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="110" y="290" text-anchor="middle" fill="#424242" font-size="12">Router</text>
  <rect x="185" y="271" width="130" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="250" y="290" text-anchor="middle" fill="#424242" font-size="12">RolloutWorker 1</text>
  <rect x="325" y="271" width="130" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="390" y="290" text-anchor="middle" fill="#424242" font-size="12">RolloutWorker 2</text>
  <rect x="465" y="271" width="130" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="530" y="290" text-anchor="middle" fill="#424242" font-size="12">RolloutWorker N</text>
  <!-- SGLang engines -->
  <rect x="185" y="316" width="130" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="250" y="335" text-anchor="middle" fill="#424242" font-size="12">SGLang Engine</text>
  <rect x="325" y="316" width="130" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="390" y="335" text-anchor="middle" fill="#424242" font-size="12">SGLang Engine</text>
  <rect x="465" y="316" width="130" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="530" y="335" text-anchor="middle" fill="#424242" font-size="12">SGLang Engine</text>
  <!-- NaiveFlows -->
  <rect x="185" y="361" width="130" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="250" y="380" text-anchor="middle" fill="#424242" font-size="12">NaiveFlow</text>
  <rect x="325" y="361" width="130" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="390" y="380" text-anchor="middle" fill="#424242" font-size="12">NaiveFlow</text>
  <rect x="465" y="361" width="130" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="530" y="380" text-anchor="middle" fill="#424242" font-size="12">NaiveFlow</text>

  <!-- DataCoordinator -->
  <rect x="640" y="270" width="220" height="120" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <rect x="640" y="270" width="220" height="26" rx="2" fill="#FFECB3" stroke="#FFD54F" stroke-width="1.2"/>
  <text x="750" y="288" text-anchor="middle" fill="#F57F17" font-size="13" font-weight="bold">DataCoordinator</text>
  <rect x="660" y="311" width="180" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="750" y="330" text-anchor="middle" fill="#424242" font-size="12">Dataloader</text>
  <rect x="660" y="351" width="180" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="750" y="370" text-anchor="middle" fill="#424242" font-size="12">Sample Buffer</text>

  <!-- Tool Environment -->
  <rect x="30" y="455" width="300" height="120" rx="2" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.2"/>
  <rect x="30" y="455" width="300" height="26" rx="2" fill="#E1BEE7" stroke="#CE93D8" stroke-width="1.2"/>
  <text x="180" y="473" text-anchor="middle" fill="#7B1FA2" font-size="13" font-weight="bold">Tool Environment</text>
  <rect x="50" y="500" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#E1BEE7" stroke-width="0.8"/>
  <text x="110" y="519" text-anchor="middle" fill="#424242" font-size="12">ToolEnv</text>
  <rect x="190" y="500" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#E1BEE7" stroke-width="0.8"/>
  <text x="250" y="519" text-anchor="middle" fill="#424242" font-size="12">AIO Proxy</text>

  <!-- Layer 2: All arrows + labels (strictly orthogonal) -->

  <!-- MainRunner → Parse Config (internal, vertical) -->
  <line x1="120" y1="126" x2="120" y2="141" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- MainRunner → TrainerGroup: spawn (horizontal) -->
  <rect x="193" y="98" width="34" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="180" y1="111" x2="260" y2="111" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="210" y="108" fill="#607D8B" font-size="8.5" font-style="italic">spawn</text>

  <!-- MainRunner → RolloutManager: spawn (vertical) -->
  <rect x="100" y="205" width="34" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="120" y1="171" x2="120" y2="230" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="117" y="215" fill="#607D8B" font-size="8.5" font-style="italic">spawn</text>

  <!-- Router → Workers (horizontal) -->
  <line x1="175" y1="286" x2="185" y2="286" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 175 286 L 180 286 L 180 286 L 325 286" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <path d="M 175 286 L 180 286 L 180 286 L 465 286" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <!-- Workers → SGLang (vertical) -->
  <line x1="250" y1="301" x2="250" y2="316" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="390" y1="301" x2="390" y2="316" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="530" y1="301" x2="530" y2="316" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- SGLang → NaiveFlow (vertical) -->
  <line x1="250" y1="346" x2="250" y2="361" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="390" y1="346" x2="390" y2="361" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="530" y1="346" x2="530" y2="361" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- NaiveFlow → ToolEnv: tool call (L-shape vertical then horizontal) -->
  <rect x="80" y="430" width="46" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 250 391 L 250 440 L 110 440 L 110 500" stroke="#AB47BC" stroke-width="1.2" fill="none" marker-end="url(#arr-p)"/>
  <text x="103" y="440" fill="#7B1FA2" font-size="8.5" font-style="italic">tool call</text>

  <!-- ToolEnv → AIO Proxy (horizontal) -->
  <line x1="170" y1="515" x2="190" y2="515" stroke="#AB47BC" stroke-width="1.2" marker-end="url(#arr-p)"/>

  <!-- DataCoordinator → TrainerGroup: batch (L-shape) -->
  <rect x="568" y="197" width="30" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 750 311 L 750 207 L 500 207 L 500 126" stroke="#FFB300" stroke-width="1.3" fill="none" marker-end="url(#arr-a)"/>
  <text x="583" y="207" fill="#F57F17" font-size="8.5" font-style="italic">batch</text>

  <!-- TrainerGroup → RolloutManager: weights (L-shape via vertical) -->
  <rect x="273" y="197" width="42" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 320 126 L 320 207 L 110 207 L 110 271" stroke="#66BB6A" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arr-g)"/>
  <text x="294" y="207" fill="#2E7D32" font-size="8.5" font-style="italic">weights</text>

  <!-- Caption -->
  <text x="450" y="685" text-anchor="middle" fill="#555" font-size="10">Figure 1: Multi-Program Multiple-Data architecture</text>
</svg>
