<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
    <marker id="arr-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#90A4AE"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#fff"/>
  <rect x="20" y="10" width="760" height="280" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="760" height="32" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">NaiveFlow Implementation</text>

  <!-- ====== Layer 1: All component boxes ====== -->

  <!-- NaiveFlow container -->
  <rect x="30" y="55" width="740" height="180" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <rect x="30" y="55" width="740" height="26" rx="2" fill="#BBDEFB" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="400" y="73" text-anchor="middle" fill="#1565C0" font-size="13" font-weight="bold">NaiveFlow (implements AgentFlow)</text>

  <!-- Sub-component boxes -->
  <rect x="50" y="100" width="130" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="115" y="119" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">preprocess()</text>
  <rect x="210" y="100" width="130" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="275" y="119" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">generate()</text>
  <rect x="370" y="100" width="130" height="30" rx="1" fill="#FFFFFF" stroke="#E1BEE7" stroke-width="0.8"/>
  <text x="435" y="119" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">execute_tools()</text>
  <rect x="530" y="100" width="130" height="30" rx="1" fill="#FFFFFF" stroke="#FFCC80" stroke-width="0.8"/>
  <text x="595" y="119" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">reward()</text>

  <!-- Multi-turn Loop box -->
  <rect x="290" y="170" width="200" height="30" rx="1" fill="#FFFFFF" stroke="#64B5F6" stroke-width="0.8"/>
  <text x="390" y="189" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">Multi-turn Loop</text>

  <!-- ====== Layer 2: All arrows + labels ====== -->

  <!-- preprocess -> generate -->
  <line x1="180" y1="115" x2="210" y2="115" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- generate -> execute_tools (if tool_calls) -->
  <rect x="335" y="97" width="30" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="340" y1="115" x2="370" y2="115" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="355" y="107" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">if tool_calls</text>

  <!-- execute_tools -> generate (append response, return loop at y=140) -->
  <rect x="325" y="133" width="70" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="435" y1="130" x2="275" y2="130" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="355" y="143" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">append response</text>

  <!-- generate -> reward (if done, horizontal) -->
  <rect x="498" y="97" width="30" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="340" y1="115" x2="530" y2="115" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="513" y="107" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">if done</text>

  <!-- generate -> Multi-turn Loop (orthogonal: down then right) -->
  <path d="M 275 130 L 275 185 L 290 185" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="6,3" fill="none" marker-end="url(#arr-dash)"/>

  <!-- execute_tools -> Multi-turn Loop (orthogonal: down then left) -->
  <path d="M 435 130 L 435 185 L 490 185" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="6,3" fill="none" marker-end="url(#arr-dash)"/>

  <!-- Caption -->
  <text x="400" y="325" text-anchor="middle" fill="#555" font-size="10">Figure 2: Default AgentFlow implementation</text>
</svg>
