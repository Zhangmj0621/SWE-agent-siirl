<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="700" height="300" fill="#fff"/>
  <rect x="20" y="10" width="660" height="240" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="660" height="28" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="29" text-anchor="middle" fill="#222" font-size="13" font-weight="bold" letter-spacing="0.3">Multi-Node Deployment</text>

  <!-- Layer 1: All container boxes -->
  <rect x="30" y="50" width="200" height="120" rx="2" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <rect x="30" y="50" width="200" height="26" rx="2" fill="#C8E6C9" stroke="#81C784" stroke-width="1.2"/>
  <text x="130" y="68" text-anchor="middle" fill="#2E7D32" font-size="13" font-weight="bold">Training Node</text>
  <rect x="260" y="50" width="200" height="120" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <rect x="260" y="50" width="200" height="26" rx="2" fill="#BBDEFB" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="360" y="68" text-anchor="middle" fill="#1565C0" font-size="13" font-weight="bold">Rollout Node</text>
  <rect x="490" y="50" width="180" height="120" rx="2" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.2"/>
  <rect x="490" y="50" width="180" height="26" rx="2" fill="#E1BEE7" stroke="#CE93D8" stroke-width="1.2"/>
  <text x="580" y="68" text-anchor="middle" fill="#7B1FA2" font-size="13" font-weight="bold">Tool Node</text>

  <!-- Sub-component boxes (all w=140, centered in containers) -->
  <rect x="60" y="95" width="140" height="30" rx="1" fill="#FFF" stroke="#81C784" stroke-width="0.8"/>
  <text x="130" y="114" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">TrainerGroup</text>
  <rect x="290" y="95" width="140" height="30" rx="1" fill="#FFF" stroke="#64B5F6" stroke-width="0.8"/>
  <text x="360" y="114" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">RolloutManager</text>
  <rect x="510" y="95" width="140" height="30" rx="1" fill="#FFF" stroke="#CE93D8" stroke-width="0.8"/>
  <text x="580" y="114" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">ToolEnv Pool</text>

  <!-- Layer 2: Arrows + labels with white bg -->
  <!-- Training -> Rollout -->
  <rect x="210" y="97" width="42" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="200" y1="110" x2="290" y2="110" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="245" y="107" text-anchor="middle" fill="#607D8B" font-size="9" font-style="italic">weights</text>

  <!-- Rollout -> Tool -->
  <rect x="442" y="97" width="46" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="430" y1="110" x2="510" y2="110" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="470" y="107" text-anchor="middle" fill="#607D8B" font-size="9" font-style="italic">tool_call</text>

  <!-- Caption -->
  <text x="350" y="285" text-anchor="middle" fill="#555" font-size="10">Figure 2: Distributed across multiple machines</text>
</svg>
