  <text x="450.0" y="241.5" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">tokenize prompt</text>
  <line x1="450.0" y1="295" x2="460.0" y2="330" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="455.0" y="306.5" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">SGLang inference</text>
  <line x1="460.0" y1="360" x2="460.0" y2="395" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="460.0" y="371.5" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">tool calls found</text>
  <line x1="460.0" y1="425" x2="460.0" y2="460" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="460.0" y="436.5" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">execute tools</text>
  <line x1="460.0" y1="490" x2="417.0" y2="520" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M392,545.0 L200,545 L200,280 L330,280.0" fill="none" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="200" y="274" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">Yes</text>
  <line x1="442" y1="545.0" x2="530" y2="545.0" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="486.0" y="539.0" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">No: TERMINATED</text>
  <text x="440.0" y="705" text-anchor="middle" fill="#555" font-size="10">Figure 2: NaiveFlow State Machine</text>
