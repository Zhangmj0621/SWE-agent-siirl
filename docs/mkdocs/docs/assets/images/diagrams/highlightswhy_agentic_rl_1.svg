<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#fff"/>
  <rect x="20" y="10" width="760" height="280" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="760" height="32" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">Traditional vs Agentic RL</text>

  <!-- ====== Layer 1: All component boxes ====== -->

  <!-- Traditional RL container -->
  <rect x="30" y="55" width="340" height="180" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.2"/>
  <rect x="30" y="55" width="340" height="26" rx="2" fill="#EEEEEE" stroke="#BDBDBD" stroke-width="1.2"/>
  <text x="200" y="73" text-anchor="middle" fill="#616161" font-size="13" font-weight="bold">Traditional RL</text>

  <!-- Agentic RL container -->
  <rect x="430" y="55" width="340" height="180" rx="2" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <rect x="430" y="55" width="340" height="26" rx="2" fill="#C8E6C9" stroke="#81C784" stroke-width="1.2"/>
  <text x="600" y="73" text-anchor="middle" fill="#2E7D32" font-size="13" font-weight="bold">Agentic RL</text>

  <!-- Traditional: Prompt (inner 50..350, span=300, N=2, w=100, gap=100) -->
  <rect x="50" y="100" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="100" y="119" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Prompt</text>

  <!-- Traditional: Generate -->
  <rect x="250" y="100" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="300" y="119" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Generate</text>

  <!-- Traditional: Reward (centered, N=1, x=150) -->
  <rect x="150" y="160" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#FFCC80" stroke-width="0.8"/>
  <text x="200" y="179" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Reward</text>

  <!-- Agentic: Prompt (inner 440..760, span=320, N=3, w=100, gap=10) -->
  <rect x="440" y="100" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="490" y="119" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Prompt</text>

  <!-- Agentic: Generate -->
  <rect x="550" y="100" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="600" y="119" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Generate</text>

  <!-- Agentic: Tool -->
  <rect x="660" y="100" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#E1BEE7" stroke-width="0.8"/>
  <text x="710" y="119" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Tool</text>

  <!-- Agentic: Reward (centered, N=1, inner 440..760, center=600, x=550) -->
  <rect x="550" y="160" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#FFCC80" stroke-width="0.8"/>
  <text x="600" y="179" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">Reward</text>

  <!-- ====== Layer 2: All arrows + labels ====== -->

  <!-- Traditional: Prompt -> Generate (horizontal) -->
  <line x1="150" y1="115" x2="250" y2="115" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Traditional: Generate -> Reward (orthogonal L-path: down then left) -->
  <path d="M 300 130 L 300 175 L 250 175" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <!-- Agentic: Prompt -> Generate (horizontal) -->
  <line x1="540" y1="115" x2="550" y2="115" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Agentic: Generate -> Tool (horizontal) -->
  <line x1="650" y1="115" x2="660" y2="115" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Agentic: Tool -> Generate (return loop, horizontal at y=142) -->
  <rect x="640" y="133" width="26" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="710" y1="130" x2="600" y2="130" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="658" y="143" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">loop</text>

  <!-- Agentic: Generate -> Reward (vertical) -->
  <line x1="600" y1="130" x2="600" y2="160" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Caption -->
  <text x="400" y="325" text-anchor="middle" fill="#555" font-size="10">Figure 1: Comparison of training approaches</text>
</svg>
