<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="800" height="380" fill="#fff"/>
  <rect x="20" y="10" width="760" height="320" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="760" height="32" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">Metrics Collection Pipeline</text>

  <!-- ====== Layer 1: All containers and boxes ====== -->

  <!-- Metric Sources container -->
  <rect x="30" y="55" width="250" height="180" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.2"/>
  <rect x="30" y="55" width="250" height="26" rx="2" fill="#EEEEEE" stroke="#BDBDBD" stroke-width="1.2"/>
  <text x="155" y="73" text-anchor="middle" fill="#616161" font-size="13" font-weight="bold">Metric Sources</text>

  <!-- MetricWorker container -->
  <rect x="320" y="55" width="180" height="180" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <rect x="320" y="55" width="180" height="26" rx="2" fill="#FFECB3" stroke="#FFD54F" stroke-width="1.2"/>
  <text x="410" y="73" text-anchor="middle" fill="#F57F17" font-size="13" font-weight="bold">MetricWorker</text>

  <!-- Outputs container -->
  <rect x="540" y="55" width="220" height="180" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <rect x="540" y="55" width="220" height="26" rx="2" fill="#FFECB3" stroke="#FFD54F" stroke-width="1.2"/>
  <text x="650" y="73" text-anchor="middle" fill="#F57F17" font-size="13" font-weight="bold">Outputs</text>

  <!-- Metric Sources sub-components (evenly distributed vertically) -->
  <rect x="50" y="100" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="110" y="119" text-anchor="middle" fill="#424242" font-size="12">TrainerGroup</text>

  <rect x="50" y="150" width="140" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="120" y="169" text-anchor="middle" fill="#424242" font-size="12">RolloutManager</text>

  <rect x="50" y="200" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="110" y="219" text-anchor="middle" fill="#424242" font-size="12">Reward Fn</text>

  <!-- MetricWorker sub-components -->
  <rect x="340" y="120" width="140" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="410" y="139" text-anchor="middle" fill="#424242" font-size="12">Aggregate</text>

  <rect x="340" y="180" width="140" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="410" y="199" text-anchor="middle" fill="#424242" font-size="12">Log</text>

  <!-- Outputs sub-components -->
  <rect x="570" y="100" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="620" y="119" text-anchor="middle" fill="#424242" font-size="12">W&amp;B</text>

  <rect x="570" y="150" width="120" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="630" y="169" text-anchor="middle" fill="#424242" font-size="12">TensorBoard</text>

  <rect x="570" y="200" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="620" y="219" text-anchor="middle" fill="#424242" font-size="12">JSON File</text>

  <!-- ====== Layer 2: All arrows (orthogonal L-shapes to avoid diagonals) ====== -->

  <!-- TrainerGroup -> Aggregate: L-shape right then down -->
  <path d="M 170 115 L 300 115 L 300 135 L 340 135" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <!-- RolloutManager -> Aggregate: L-shape right then up -->
  <path d="M 190 165 L 310 165 L 310 135 L 340 135" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <!-- Reward Fn -> Aggregate: L-shape right then up -->
  <path d="M 170 215 L 290 215 L 290 135 L 340 135" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <!-- Log -> W&B: L-shape right then up -->
  <path d="M 480 195 L 530 195 L 530 115 L 570 115" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <!-- Log -> TensorBoard: horizontal -->
  <path d="M 480 195 L 540 195 L 540 165 L 570 165" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <!-- Log -> JSON File: L-shape right then down -->
  <path d="M 480 195 L 550 195 L 550 215 L 570 215" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <!-- Caption -->
  <text x="400" y="365" text-anchor="middle" fill="#555" font-size="10">Figure 1: How metrics are collected and reported</text>
</svg>
