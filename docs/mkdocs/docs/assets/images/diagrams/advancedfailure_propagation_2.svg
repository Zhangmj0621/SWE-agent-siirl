<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 716" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
    <marker id="seq-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="980" height="716" fill="#fff"/>
  <rect x="20" y="10" width="940" height="656" rx="0" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="20" y="10" width="940" height="32" rx="0" fill="#F8F9FA" stroke="#333333" stroke-width="1.5"/>
  <text x="490" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">Advanced &gt; Failure Propagation (Fig. 2)</text>

  <!-- Loop boxes -->
  <rect x="30" y="219" width="780" height="83" rx="2" fill="none" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="6,3"/>
  <rect x="30" y="219" width="133" height="16" rx="2" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="0.8"/>
  <text x="38" y="231" fill="#546E7A" font-size="10.5" font-weight="600">loop: Polling loop</text>
  <rect x="30" y="333" width="780" height="83" rx="2" fill="none" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="6,3"/>
  <rect x="30" y="333" width="133" height="16" rx="2" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="0.8"/>
  <text x="38" y="345" fill="#546E7A" font-size="10.5" font-weight="600">loop: Polling loop</text>

  <!-- Layer 1: Lifeline boxes -->
  <line x1="60" y1="88" x2="60" y2="586" stroke="#CFD8DC" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="20" y="60" width="80" height="28" rx="2" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <text x="60" y="78" text-anchor="middle" fill="#2E7D32" font-size="12" font-weight="600">Trainer</text>

  <line x1="240" y1="88" x2="240" y2="586" stroke="#CFD8DC" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="177.5" y="60" width="125" height="28" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <text x="240" y="78" text-anchor="middle" fill="#F57F17" font-size="12" font-weight="600">TaskCoordinator</text>

  <line x1="420" y1="88" x2="420" y2="586" stroke="#CFD8DC" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="361" y="60" width="118" height="28" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="420" y="78" text-anchor="middle" fill="#1565C0" font-size="12" font-weight="600">RolloutManager</text>

  <line x1="600" y1="88" x2="600" y2="586" stroke="#CFD8DC" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="537.5" y="60" width="125" height="28" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <text x="600" y="78" text-anchor="middle" fill="#F57F17" font-size="12" font-weight="600">DataCoordinator</text>

  <line x1="780" y1="88" x2="780" y2="586" stroke="#CFD8DC" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="735" y="60" width="90" height="28" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.2"/>
  <text x="780" y="78" text-anchor="middle" fill="#616161" font-size="12" font-weight="600">MainRunner</text>

  <!-- Note boxes -->
  <rect x="80" y="106" width="120" height="28" rx="2" fill="#FFFDE7" stroke="#FDD835" stroke-width="0.8"/>
  <text x="88" y="120" fill="#6D4C00" font-size="10.5">CUDA OOM occurs</text>

  <rect x="440" y="288" width="120" height="38" rx="2" fill="#FFFDE7" stroke="#FDD835" stroke-width="0.8"/>
  <text x="448" y="302" fill="#6D4C00" font-size="10.5">Cancel pending</text>
  <text x="448" y="316" fill="#6D4C00" font-size="10.5">rollouts</text>

  <rect x="620" y="402" width="120" height="38" rx="2" fill="#FFFDE7" stroke="#FDD835" stroke-width="0.8"/>
  <text x="628" y="416" fill="#6D4C00" font-size="10.5">Stop accepting</text>
  <text x="628" y="430" fill="#6D4C00" font-size="10.5">samples</text>

  <rect x="800" y="516" width="120" height="38" rx="2" fill="#FFFDE7" stroke="#FDD835" stroke-width="0.8"/>
  <text x="808" y="530" fill="#6D4C00" font-size="10.5">Run cleanup</text>
  <text x="808" y="544" fill="#6D4C00" font-size="10.5">procedures</text>

  <!-- Layer 2: All arrows + bg rects + labels -->
  <!-- Trainer → TaskCoordinator: report_failure -->
  <rect x="83" y="132" width="194" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="60" y1="146" x2="240" y2="146" stroke="#78909C" stroke-width="1.2" marker-end="url(#seq-arr)"/>
  <text x="150" y="141" text-anchor="middle" fill="#607D8B" font-size="10.5">report_failure(&quot;trainer&quot;, &quot;CUDA OOM&quot;)</text>

  <!-- TaskCoordinator self-call: Set status = FAILED -->
  <path d="M 240 180 L 270 180 L 270 198 L 240 198" fill="none" stroke="#78909C" stroke-width="1.2" marker-end="url(#seq-arr)"/>
  <text x="274" y="192" fill="#78909C" font-size="10.5">Set status = FAILED</text>

  <!-- RolloutManager → TaskCoordinator: should_stop? -->
  <rect x="282" y="210" width="96" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="420" y1="224" x2="240" y2="224" stroke="#78909C" stroke-width="1.2" marker-end="url(#seq-arr)"/>
  <text x="330" y="219" text-anchor="middle" fill="#607D8B" font-size="10.5">should_stop()?</text>

  <!-- TaskCoordinator → RolloutManager: True -->
  <rect x="318" y="244" width="24" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="240" y1="258" x2="420" y2="258" stroke="#78909C" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seq-arr)"/>
  <text x="330" y="253" text-anchor="middle" fill="#607D8B" font-size="10.5">True</text>

  <!-- DataCoordinator → TaskCoordinator: should_stop? -->
  <rect x="372" y="324" width="96" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="600" y1="338" x2="240" y2="338" stroke="#78909C" stroke-width="1.2" marker-end="url(#seq-arr)"/>
  <text x="420" y="333" text-anchor="middle" fill="#607D8B" font-size="10.5">should_stop()?</text>

  <!-- TaskCoordinator → DataCoordinator: True -->
  <rect x="408" y="358" width="24" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="240" y1="372" x2="600" y2="372" stroke="#78909C" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seq-arr)"/>
  <text x="420" y="367" text-anchor="middle" fill="#607D8B" font-size="10.5">True</text>

  <!-- MainRunner → TaskCoordinator: get_summary() -->
  <rect x="450" y="438" width="120" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="780" y1="452" x2="240" y2="452" stroke="#78909C" stroke-width="1.2" marker-end="url(#seq-arr)"/>
  <text x="510" y="447" text-anchor="middle" fill="#607D8B" font-size="10.5">get_summary()</text>

  <!-- TaskCoordinator → MainRunner: response -->
  <rect x="384" y="472" width="252" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="240" y1="486" x2="780" y2="486" stroke="#78909C" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#seq-arr)"/>
  <text x="510" y="481" text-anchor="middle" fill="#607D8B" font-size="10.5">{status: &quot;failed&quot;, reason: &quot;CUDA OOM&quot;}</text>

  <!-- Caption -->
  <text x="490" y="701" text-anchor="middle" fill="#555" font-size="10">Figure 2: CUDA OOM Propagation</text>
</svg>
