<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="720" height="720" fill="#fff"/>
  <rect x="20" y="10" width="680" height="660" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="680" height="28" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="29" text-anchor="middle" fill="#222" font-size="13" font-weight="bold" letter-spacing="0.3">Developer Guide > Code Structure (Fig. 1)</text>

  <!-- Containers with header bars -->
  <rect x="30" y="48" width="190" height="88" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.2"/>
  <rect x="30" y="48" width="190" height="26" rx="2" fill="#EEEEEE" stroke="#BDBDBD" stroke-width="1.2"/>
  <text x="125" y="66" text-anchor="middle" fill="#616161" font-size="13" font-weight="bold">MainRunner</text>

  <rect x="30" y="155" width="650" height="405" rx="2" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <rect x="30" y="155" width="650" height="26" rx="2" fill="#C8E6C9" stroke="#81C784" stroke-width="1.2"/>
  <text x="355" y="173" text-anchor="middle" fill="#2E7D32" font-size="13" font-weight="bold">Training Step</text>

  <rect x="30" y="578" width="220" height="88" rx="2" fill="#FFEBEE" stroke="#EF9A9A" stroke-width="1.2"/>
  <rect x="30" y="578" width="220" height="26" rx="2" fill="#FFCDD2" stroke="#EF9A9A" stroke-width="1.2"/>
  <text x="140" y="596" text-anchor="middle" fill="#C62828" font-size="13" font-weight="bold">Reporting</text>

  <!-- ====== Layer 1: All boxes ====== -->

  <!-- MainRunner box (header bottom=74, 74+15=89, was 90 -> OK at 90) -->
  <rect x="50" y="90" width="150" height="30" rx="1" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8"/>
  <text x="125" y="109" text-anchor="middle" fill="#424242" font-size="12">MainRunner.run()</text>

  <!-- Training step boxes (header bottom=181, 181+15=196, was 195 -> shift to 196) -->
  <rect x="50" y="196" width="180" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="140" y="215" text-anchor="middle" fill="#424242" font-size="12">TrainerGroup.train()</text>

  <!-- 3 parallel boxes: evenly distributed in w=620 (x=50..670), each w=170, gap=(620-510)/2=55 -->
  <rect x="50" y="271" width="170" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="135" y="290" text-anchor="middle" fill="#424242" font-size="12">DataCoordinator.get()</text>
  <rect x="275" y="271" width="170" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="360" y="290" text-anchor="middle" fill="#424242" font-size="12">Actor.forward()</text>
  <rect x="500" y="271" width="170" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="585" y="290" text-anchor="middle" fill="#424242" font-size="12">Critic.forward()</text>

  <rect x="50" y="346" width="180" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="140" y="365" text-anchor="middle" fill="#424242" font-size="12">compute_advantage()</text>

  <rect x="50" y="421" width="170" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="135" y="440" text-anchor="middle" fill="#424242" font-size="12">compute_loss()</text>

  <rect x="50" y="496" width="170" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="135" y="515" text-anchor="middle" fill="#424242" font-size="12">Actor.backward()</text>

  <!-- Reporting box (header bottom=604, 604+15=619, was 615 -> shift to 619) -->
  <rect x="50" y="619" width="180" height="30" rx="1" fill="#FFFFFF" stroke="#EF9A9A" stroke-width="0.8"/>
  <text x="140" y="638" text-anchor="middle" fill="#424242" font-size="12">MetricWorker.report()</text>

  <!-- ====== Layer 2: All arrows + labels (orthogonal only) ====== -->

  <!-- MainRunner.run() -> TrainerGroup.train() (vertical) -->
  <line x1="125" y1="120" x2="125" y2="196" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="84" y="148" width="82" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="125" y="158" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">launch training</text>

  <!-- TrainerGroup.train() -> DataCoordinator.get() (vertical) -->
  <line x1="135" y1="226" x2="135" y2="271" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="102" y="240" width="66" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="135" y="250" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">fetch batch</text>

  <!-- TrainerGroup.train() -> Actor.forward() (L-path: down then right) -->
  <path d="M 230 211 L 360 211 L 360 271" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <rect x="262" y="233" width="76" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="300" y="243" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">model inference</text>

  <!-- TrainerGroup.train() -> Critic.forward() (L-path: right then down) -->
  <path d="M 230 211 L 585 211 L 585 271" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <rect x="384" y="199" width="130" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="449" y="209" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">value estimation (PPO only)</text>

  <!-- Actor.forward() -> compute_advantage() (L-path: down then left) -->
  <path d="M 360 301 L 360 331 L 140 331 L 140 346" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <!-- Critic.forward() -> compute_advantage() (L-path: down then left) -->
  <path d="M 585 301 L 585 331 L 160 331" stroke="#78909C" stroke-width="1.2" fill="none"/>

  <!-- compute_advantage() -> compute_loss() (vertical) -->
  <line x1="135" y1="376" x2="135" y2="421" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="100" y="390" width="70" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="135" y="400" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">GAE / GRPO</text>

  <!-- compute_loss() -> Actor.backward() (vertical) -->
  <line x1="135" y1="451" x2="135" y2="496" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="89" y="465" width="92" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="135" y="475" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">dual-clip PPO loss</text>

  <!-- Actor.backward() -> MetricWorker.report() (vertical) -->
  <line x1="135" y1="526" x2="135" y2="619" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="95" y="565" width="80" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="135" y="575" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">gradient update</text>

  <!-- Caption -->
  <text x="360" y="705" text-anchor="middle" fill="#555" font-size="10">Figure 1: Training Step Data Flow</text>
</svg>
