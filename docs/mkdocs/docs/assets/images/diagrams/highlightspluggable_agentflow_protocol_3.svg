<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="700" height="300" fill="#fff"/>
  <rect x="20" y="10" width="660" height="240" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="660" height="32" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">Custom AgentFlow Extension</text>

  <!-- ====== Layer 1: All component boxes ====== -->

  <!-- AgentFlow Protocol box -->
  <rect x="260" y="80" width="180" height="40" rx="1" fill="#FFFFFF" stroke="#64B5F6" stroke-width="0.8"/>
  <text x="350" y="104" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">AgentFlow Protocol</text>

  <!-- NaiveFlow box -->
  <rect x="80" y="180" width="140" height="40" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="150" y="204" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">NaiveFlow</text>

  <!-- CustomFlow box -->
  <rect x="280" y="180" width="140" height="40" rx="1" fill="#FFFFFF" stroke="#FFCC80" stroke-width="0.8"/>
  <text x="350" y="204" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">CustomFlow</text>

  <!-- EvalFlow box -->
  <rect x="480" y="180" width="140" height="40" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="550" y="204" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">EvalFlow</text>

  <!-- ====== Layer 2: All arrows + labels (orthogonal L-paths) ====== -->

  <!-- AgentFlow -> NaiveFlow: "implements" (L-path: down then left) -->
  <rect x="107" y="137" width="60" height="14" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 300 120 L 300 150 L 150 150 L 150 180" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="137" y="148" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">implements</text>

  <!-- AgentFlow -> CustomFlow: "implements" (vertical) -->
  <rect x="320" y="137" width="60" height="14" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="350" y1="120" x2="350" y2="180" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="350" y="148" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">implements</text>

  <!-- AgentFlow -> EvalFlow: "implements" (L-path: down then right) -->
  <rect x="508" y="137" width="60" height="14" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 400 120 L 400 150 L 550 150 L 550 180" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="538" y="148" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">implements</text>

  <!-- Caption -->
  <text x="350" y="285" text-anchor="middle" fill="#555" font-size="10">Figure 3: How to extend AgentFlow for custom logic</text>
</svg>
