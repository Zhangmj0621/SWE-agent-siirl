<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="960" height="720" fill="#fff"/>
  <rect x="20" y="10" width="920" height="660" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="920" height="32" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="480" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">Reference &gt; Module Map (Fig. 1)</text>

  <!-- ====== Layer 1: All containers and component boxes ====== -->

  <!-- Entry Point container -->
  <rect x="30" y="48" width="170" height="88" rx="2" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1.2"/>
  <rect x="30" y="48" width="170" height="26" rx="2" fill="#F0F0F0" stroke="#E0E0E0" stroke-width="1.2"/>
  <text x="115" y="66" text-anchor="middle" fill="#616161" font-size="13" font-weight="bold">Entry Point</text>
  <rect x="40" y="78" width="150" height="30" rx="1" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8"/>
  <text x="115" y="97" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">async_train.py</text>

  <!-- Worker Layer container -->
  <rect x="30" y="155" width="570" height="80" rx="2" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1.2"/>
  <rect x="30" y="155" width="570" height="26" rx="2" fill="#F0F0F0" stroke="#E0E0E0" stroke-width="1.2"/>
  <text x="315" y="173" text-anchor="middle" fill="#616161" font-size="13" font-weight="bold">Worker Layer</text>
  <!-- Worker sub-boxes: 3 boxes w=150, evenly in 530px span (padding=20): gap=(530-450)/2=40 -->
  <rect x="50" y="190" width="150" height="30" rx="1" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8"/>
  <text x="125" y="209" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">worker/actor/</text>
  <rect x="240" y="190" width="150" height="30" rx="1" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8"/>
  <text x="315" y="209" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">worker/rollout/</text>
  <rect x="430" y="190" width="150" height="30" rx="1" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8"/>
  <text x="505" y="209" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">worker/validate/</text>

  <!-- Execution Layer container -->
  <rect x="30" y="255" width="580" height="125" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <rect x="30" y="255" width="580" height="26" rx="2" fill="#BBDEFB" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="320" y="273" text-anchor="middle" fill="#1565C0" font-size="13" font-weight="bold">Execution Layer</text>
  <!-- Execution sub-boxes: row 1 (y=285) — 2 boxes, span=540, w=250 each, gap=(540-500)/1=40 -->
  <rect x="50" y="290" width="250" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="175" y="309" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">execution/rollout/agent_executor/</text>
  <rect x="340" y="290" width="250" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="465" y="309" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">engine/actor/</text>
  <!-- Execution sub-boxes: row 2 (y=335) — 2 boxes, span=540, w=250 each, gap=40 -->
  <rect x="50" y="340" width="250" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="175" y="359" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">execution/rollout/agent_flow/</text>
  <rect x="340" y="340" width="250" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="465" y="359" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">execution/rollout/agentflow/</text>

  <!-- Data Layer container -->
  <rect x="630" y="255" width="170" height="125" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <rect x="630" y="255" width="170" height="26" rx="2" fill="#FFECB3" stroke="#FFD54F" stroke-width="1.2"/>
  <text x="715" y="273" text-anchor="middle" fill="#F57F17" font-size="13" font-weight="bold">Data Layer</text>
  <rect x="645" y="290" width="140" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="715" y="309" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">data_coordinator/</text>
  <rect x="645" y="340" width="140" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="715" y="359" text-anchor="middle" fill="#424242" font-size="11" font-weight="normal">data_coordinator/dataloader/</text>

  <!-- Foundation container -->
  <rect x="30" y="400" width="580" height="70" rx="2" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1.2"/>
  <rect x="30" y="400" width="580" height="26" rx="2" fill="#F0F0F0" stroke="#E0E0E0" stroke-width="1.2"/>
  <text x="320" y="418" text-anchor="middle" fill="#616161" font-size="13" font-weight="bold">Foundation</text>
  <!-- Foundation sub-boxes: 3 boxes, span=540, w=150 each, gap=(540-450)/2=45 -->
  <rect x="50" y="435" width="150" height="30" rx="1" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8"/>
  <text x="125" y="454" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">models/</text>
  <rect x="245" y="435" width="150" height="30" rx="1" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8"/>
  <text x="320" y="454" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">utils/</text>
  <rect x="440" y="435" width="150" height="30" rx="1" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8"/>
  <text x="515" y="454" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">engine/param_sync/</text>

  <!-- Engine Layer (rollout engine) -->
  <rect x="30" y="490" width="220" height="70" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <rect x="30" y="490" width="220" height="26" rx="2" fill="#BBDEFB" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="140" y="508" text-anchor="middle" fill="#1565C0" font-size="13" font-weight="bold">Engine Layer</text>
  <rect x="50" y="525" width="180" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="140" y="544" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">engine/rollout/</text>

  <!-- Environment Layer -->
  <rect x="280" y="490" width="220" height="70" rx="2" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.2"/>
  <rect x="280" y="490" width="220" height="26" rx="2" fill="#E1BEE7" stroke="#CE93D8" stroke-width="1.2"/>
  <text x="390" y="508" text-anchor="middle" fill="#7B1FA2" font-size="13" font-weight="bold">Environment Layer</text>
  <rect x="300" y="525" width="180" height="30" rx="1" fill="#FFFFFF" stroke="#E1BEE7" stroke-width="0.8"/>
  <text x="390" y="544" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">environment/tool_env/</text>

  <!-- Algorithm Layer -->
  <rect x="820" y="255" width="120" height="125" rx="2" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <rect x="820" y="255" width="120" height="26" rx="2" fill="#C8E6C9" stroke="#81C784" stroke-width="1.2"/>
  <text x="880" y="273" text-anchor="middle" fill="#2E7D32" font-size="13" font-weight="bold">Algorithm Layer</text>
  <rect x="830" y="290" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="880" y="309" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">algorithm/</text>

  <!-- Config -->
  <rect x="630" y="155" width="170" height="80" rx="2" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1.2"/>
  <rect x="630" y="155" width="170" height="26" rx="2" fill="#F0F0F0" stroke="#E0E0E0" stroke-width="1.2"/>
  <text x="715" y="173" text-anchor="middle" fill="#616161" font-size="13" font-weight="bold">Config</text>
  <rect x="645" y="190" width="140" height="30" rx="1" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8"/>
  <text x="715" y="209" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">params/</text>

  <!-- ====== Layer 2: All arrows + labels (orthogonal only) ====== -->

  <!-- async_train.py -> worker/actor/: "orchestrates" (vertical) -->
  <rect x="82" y="122" width="64" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="115" y1="108" x2="115" y2="155" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="115" y="132" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">orchestrates</text>

  <!-- async_train.py -> worker/rollout/: "orchestrates" (L-path: down then right) -->
  <rect x="200" y="122" width="64" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 140 108 L 140 140 L 315 140 L 315 155" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="232" y="132" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">orchestrates</text>

  <!-- async_train.py -> worker/validate/: "orchestrates" (L-path: down then right) -->
  <rect x="360" y="122" width="64" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 160 108 L 160 140 L 505 140 L 505 155" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="392" y="132" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">orchestrates</text>

  <!-- async_train.py -> params/: "reads config" (L-path: right then down) -->
  <rect x="540" y="82" width="64" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 190 93 L 715 93 L 715 155" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="572" y="90" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">reads config</text>

  <!-- worker/actor/ -> engine/actor/: "trains with" (vertical) -->
  <rect x="84" y="232" width="60" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 125 220 L 125 305 L 340 305" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="115" y="242" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">trains with</text>

  <!-- worker/actor/ -> data_coordinator/: "fetches data" (L-path) -->
  <rect x="528" y="232" width="64" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 200 205 L 210 205 L 210 240 L 715 240 L 715 290" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="560" y="242" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">fetches data</text>

  <!-- worker/actor/ -> algorithm/: "computes loss" (L-path) -->
  <rect x="820" y="232" width="64" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 200 200 L 220 200 L 220 240 L 880 240 L 880 290" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="852" y="242" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">computes loss</text>

  <!-- worker/rollout/ -> agent_executor/: "dispatches to" (vertical) -->
  <rect x="205" y="232" width="70" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 315 220 L 315 255 L 175 255 L 175 290" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="240" y="242" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">dispatches to</text>

  <!-- agent_executor/ -> agent_flow/: "runs" (vertical) -->
  <rect x="137" y="327" width="24" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="150" y1="320" x2="150" y2="340" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="149" y="337" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">runs</text>

  <!-- agent_executor/ -> agentflow/: "runs" (L-path) -->
  <rect x="378" y="327" width="24" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 300 305 L 310 305 L 310 330 L 465 330 L 465 340" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="390" y="337" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">runs</text>

  <!-- worker/rollout/ -> engine/rollout/: "infers with" (L-path) -->
  <rect x="312" y="482" width="56" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 315 220 L 315 245 L 30 245 L 30 490 L 30 540 L 50 540" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="340" y="492" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">infers with</text>

  <!-- agent_flow/ -> environment/tool_env/: "calls tools" (vertical) -->
  <rect x="145" y="482" width="56" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 175 370 L 175 480 L 390 480 L 390 490" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="173" y="492" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">calls tools</text>

  <!-- agentflow/ -> environment/tool_env/: "calls tools" (L-path) -->
  <rect x="455" y="482" width="56" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 465 370 L 465 480 L 390 480 L 390 490" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="483" y="492" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">calls tools</text>

  <!-- engine/actor/ -> engine/param_sync/: "syncs weights" (L-path) -->
  <rect x="462" y="388" width="70" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 465 320 L 465 385 L 515 385 L 515 435" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="497" y="398" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">syncs weights</text>

  <!-- engine/param_sync/ -> engine/rollout/: "updates" (L-path: down then left) -->
  <rect x="264" y="472" width="44" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 515 465 L 515 475 L 140 475 L 140 490" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="286" y="482" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">updates</text>

  <!-- data_coordinator/ -> dataloader/: "loads from" (vertical) -->
  <rect x="675" y="327" width="56" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="715" y1="320" x2="715" y2="340" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="703" y="337" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">loads from</text>

  <!-- worker/actor/ -> models/: "loads model" (L-path) -->
  <rect x="64" y="388" width="66" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 125 220 L 125 385 L 125 385 L 125 435" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="97" y="398" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">loads model</text>

  <!-- worker/rollout/ -> models/: "loads model" (L-path) -->
  <rect x="220" y="388" width="66" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 315 220 L 315 385 L 125 385 L 125 435" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="253" y="398" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">loads model</text>

  <!-- async_train.py -> utils/: "lifecycle mgmt" (L-path) -->
  <rect x="280" y="82" width="72" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 190 93 L 320 93 L 320 435" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="316" y="90" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">lifecycle mgmt</text>

  <!-- worker/actor/ -> utils/: "reports metrics" (vertical) -->
  <rect x="340" y="388" width="76" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 200 205 L 230 205 L 230 385 L 320 385 L 320 435" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="378" y="398" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">reports metrics</text>

  <!-- Caption -->
  <text x="480" y="705" text-anchor="middle" fill="#555" font-size="10">Figure 1: Module Dependency Map</text>
</svg>
