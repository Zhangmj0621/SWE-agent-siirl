<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#AB47BC"/>
    </marker>
  </defs>
  <rect width="700" height="380" fill="#fff"/>
  <rect x="20" y="10" width="660" height="320" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="660" height="32" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">Tool Environment Architecture</text>

  <!-- ====== Layer 1: All containers and boxes ====== -->

  <!-- NaiveFlow container -->
  <rect x="30" y="55" width="640" height="140" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <rect x="30" y="55" width="640" height="26" rx="2" fill="#BBDEFB" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="350" y="73" text-anchor="middle" fill="#1565C0" font-size="13" font-weight="bold">NaiveFlow</text>

  <!-- Tool Environment container -->
  <rect x="30" y="220" width="640" height="100" rx="2" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.2"/>
  <rect x="30" y="220" width="640" height="26" rx="2" fill="#E1BEE7" stroke="#CE93D8" stroke-width="1.2"/>
  <text x="350" y="238" text-anchor="middle" fill="#7B1FA2" font-size="13" font-weight="bold">Tool Environment</text>

  <!-- NaiveFlow sub-components: 4 boxes evenly distributed
       Inner: x=50..650, span=600, widths: 100+100+110+100=410, gaps: (600-410)/3=63
       Positions: 50, 213, 376, 539 -->
  <rect x="50" y="100" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="100" y="119" text-anchor="middle" fill="#424242" font-size="12">Generate</text>

  <rect x="213" y="100" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="263" y="119" text-anchor="middle" fill="#424242" font-size="12">Parse</text>

  <rect x="376" y="100" width="110" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="431" y="119" text-anchor="middle" fill="#424242" font-size="12">Tool Call</text>

  <rect x="549" y="100" width="100" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="599" y="119" text-anchor="middle" fill="#424242" font-size="12">Result</text>

  <!-- Tool Environment sub-components: 3 boxes evenly distributed
       Inner: x=50..650, span=600, w=140, gap=(600-420)/2=90
       Positions: 50, 230, 410 -->
  <rect x="50" y="262" width="140" height="30" rx="1" fill="#FFFFFF" stroke="#E1BEE7" stroke-width="0.8"/>
  <text x="120" y="281" text-anchor="middle" fill="#424242" font-size="12">Sandbox Container</text>

  <rect x="230" y="262" width="140" height="30" rx="1" fill="#FFFFFF" stroke="#E1BEE7" stroke-width="0.8"/>
  <text x="300" y="281" text-anchor="middle" fill="#424242" font-size="12">Execute Code</text>

  <rect x="410" y="262" width="140" height="30" rx="1" fill="#FFFFFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="480" y="281" text-anchor="middle" fill="#424242" font-size="12">Capture Output</text>

  <!-- ====== Layer 2: All arrows (strictly orthogonal) ====== -->

  <!-- Generate -> Parse -->
  <line x1="150" y1="115" x2="213" y2="115" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Parse -> Tool Call -->
  <line x1="313" y1="115" x2="376" y2="115" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Tool Call -> Sandbox Container: orthogonal L-shape down then left -->
  <rect x="147" y="193" width="40" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 431 130 L 431 195 L 120 195 L 120 262" stroke="#AB47BC" stroke-width="1.2" fill="none" marker-end="url(#arr-p)"/>
  <text x="167" y="203" text-anchor="middle" fill="#607D8B" font-size="8.5" font-style="italic">tool call</text>

  <!-- Sandbox Container -> Execute Code -->
  <line x1="190" y1="277" x2="230" y2="277" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Execute Code -> Capture Output -->
  <line x1="370" y1="277" x2="410" y2="277" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Capture Output -> Result: orthogonal L-shape up then right -->
  <rect x="524" y="193" width="32" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <path d="M 480 262 L 480 195 L 599 195 L 599 130" stroke="#AB47BC" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr-p)"/>
  <text x="540" y="203" text-anchor="middle" fill="#607D8B" font-size="8.5" font-style="italic">result</text>

  <!-- Caption -->
  <text x="350" y="365" text-anchor="middle" fill="#555" font-size="10">Figure 1: How tools are executed</text>
</svg>
