<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#fff"/>
  <rect x="20" y="10" width="760" height="440" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="760" height="28" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="29" text-anchor="middle" fill="#222" font-size="13" font-weight="bold" letter-spacing="0.3">Multi-turn Sequence</text>

  <!-- Participant boxes -->
  <rect x="60" y="50" width="100" height="30" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="110" y="69" text-anchor="middle" fill="#1565C0" font-size="11" font-weight="600">User</text>
  <rect x="305" y="50" width="110" height="30" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="360" y="69" text-anchor="middle" fill="#1565C0" font-size="11" font-weight="600">LLM Agent</text>
  <rect x="555" y="50" width="110" height="30" rx="2" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.2"/>
  <text x="610" y="69" text-anchor="middle" fill="#7B1FA2" font-size="11" font-weight="600">Tool Env</text>

  <!-- Lifelines (vertical dashed) -->
  <line x1="110" y1="80" x2="110" y2="420" stroke="#BDBDBD" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="360" y1="80" x2="360" y2="420" stroke="#BDBDBD" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="610" y1="80" x2="610" y2="420" stroke="#BDBDBD" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Layer 1: All arrows -->
  <line x1="110" y1="110" x2="360" y2="110" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="360" y1="155" x2="610" y2="155" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="610" y1="200" x2="360" y2="200" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="360" y1="245" x2="610" y2="245" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="610" y1="290" x2="360" y2="290" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="360" y1="335" x2="110" y2="335" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Layer 2: All labels with white bg rects -->
  <!-- User prompt -->
  <rect x="197" y="96" width="66" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="230" y="106" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">User prompt</text>
  <!-- tool_call(args) 1 -->
  <rect x="443" y="141" width="72" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="479" y="151" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">tool_call(args)</text>
  <!-- tool_response 1 -->
  <rect x="446" y="186" width="68" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="480" y="196" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">tool_response</text>
  <!-- tool_call(args) 2 -->
  <rect x="443" y="231" width="72" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="479" y="241" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">tool_call(args)</text>
  <!-- tool_response 2 -->
  <rect x="446" y="276" width="68" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="480" y="286" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">tool_response</text>
  <!-- Final answer -->
  <rect x="197" y="321" width="66" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="230" y="331" text-anchor="middle" fill="#607D8B" font-size="9.5" font-style="italic">Final answer</text>

  <!-- Turn indicators -->
  <text x="35" y="114" fill="#9E9E9E" font-size="9" font-style="italic">T=0</text>
  <text x="35" y="178" fill="#9E9E9E" font-size="9" font-style="italic">T=1</text>
  <text x="35" y="268" fill="#9E9E9E" font-size="9" font-style="italic">T=2</text>
  <text x="35" y="339" fill="#9E9E9E" font-size="9" font-style="italic">T=3</text>

  <!-- Caption -->
  <text x="400" y="485" text-anchor="middle" fill="#555" font-size="10">Figure 2: Multi-Turn Message Flow</text>
</svg>
