<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/></marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0.8, 7 3, 0 5.2" fill="#66BB6A"/></marker>
    <marker id="arr-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0.8, 7 3, 0 5.2" fill="#AB47BC"/></marker>
  </defs>
  <rect width="860" height="400" fill="#fff"/>

  <!-- Title bar -->
  <rect x="20" y="10" width="820" height="340" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="820" height="28" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="430" y="29" text-anchor="middle" fill="#222" font-size="13" font-weight="bold" letter-spacing="0.3">End-to-End Data Flow</text>

  <!-- ====== ROW 1: FORWARD PATH (boxes y=62, h=34, cy=79, arrows y=79) ====== -->
  <text x="35" y="55" fill="#607D8B" font-size="9.5" font-weight="bold" letter-spacing="0.5">FORWARD</text>

  <!-- Layer 1: All component boxes (drawn first as base layer) -->
  <rect x="35" y="62" width="100" height="34" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1"/>
  <text x="85" y="83" text-anchor="middle" fill="#424242" font-size="11">Parquet</text>
  <rect x="165" y="62" width="130" height="34" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <text x="230" y="83" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">DataCoordinator</text>
  <rect x="325" y="62" width="130" height="34" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1.2"/>
  <text x="390" y="83" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">RolloutManager</text>
  <rect x="485" y="62" width="100" height="34" rx="2" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="535" y="83" text-anchor="middle" fill="#1565C0" font-size="11">SGLang</text>
  <rect x="615" y="62" width="100" height="34" rx="2" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="665" y="83" text-anchor="middle" fill="#1565C0" font-size="11">NaiveFlow</text>

  <!-- Layer 2: All arrows + labels (drawn on top so labels are never occluded by boxes) -->
  <!-- Parquet → DC: "load" -->
  <rect x="139" y="62" width="22" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="135" y1="79" x2="165" y2="79" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="150" y="72" text-anchor="middle" fill="#607D8B" font-size="8.5" font-style="italic">load</text>
  <!-- DC → RM: "prompts" -->
  <rect x="293" y="62" width="34" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="295" y1="79" x2="325" y2="79" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="310" y="72" text-anchor="middle" fill="#607D8B" font-size="8.5" font-style="italic">prompts</text>
  <!-- RM → SGLang: "dispatch" -->
  <rect x="453" y="62" width="34" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="455" y1="79" x2="485" y2="79" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="470" y="72" text-anchor="middle" fill="#607D8B" font-size="8.5" font-style="italic">dispatch</text>
  <!-- SGLang → NaiveFlow: "tokens" -->
  <rect x="588" y="62" width="24" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="585" y1="79" x2="615" y2="79" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="600" y="72" text-anchor="middle" fill="#607D8B" font-size="8.5" font-style="italic">tokens</text>

  <!-- ====== MULTI-TURN LOOP BOX (x=540..810, y=115..210) ====== -->
  <rect x="540" y="115" width="275" height="95" rx="3" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="677" y="133" text-anchor="middle" fill="#7B1FA2" font-size="10.5" font-weight="bold">Multi-turn Interaction Loop</text>

  <!-- NaiveFlow → loop -->
  <line x1="665" y1="96" x2="665" y2="115" stroke="#AB47BC" stroke-width="1.1" marker-end="url(#arr-p)"/>

  <!-- ToolEnv + AIO Proxy inside loop -->
  <rect x="560" y="150" width="100" height="28" rx="1" fill="#FFF" stroke="#E1BEE7" stroke-width="0.8"/>
  <text x="610" y="168" text-anchor="middle" fill="#424242" font-size="10.5">ToolEnv</text>
  <rect x="690" y="150" width="100" height="28" rx="1" fill="#FFF" stroke="#E1BEE7" stroke-width="0.8"/>
  <text x="740" y="168" text-anchor="middle" fill="#424242" font-size="10.5">AIO Proxy</text>
  <line x1="660" y1="164" x2="690" y2="164" stroke="#AB47BC" stroke-width="1" marker-end="url(#arr-p)"/>
  <!-- Return loop inside box -->
  <path d="M 790 164 L 800 164 L 800 96 L 715 96" stroke="#AB47BC" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arr-p)"/>
  <text x="808" y="135" fill="#7B1FA2" font-size="8.5" font-style="italic" transform="rotate(90,808,135)">response</text>

  <!-- ====== COMPLETED PATH: NaiveFlow → Reward (x=820, right of loop box=815) ====== -->
  <path d="M 715 79 L 820 79 L 820 265 L 700 265" stroke="#78909C" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="828" y="172" fill="#607D8B" font-size="9" font-style="italic" transform="rotate(90,828,172)">completed</text>

  <!-- ====== ROW 2: RETURN PATH (boxes y=248, h=34, cy=265) ====== -->
  <line x1="35" y1="232" x2="825" y2="232" stroke="#E0E0E0" stroke-width="0.8" stroke-dasharray="4,4"/>
  <text x="35" y="246" fill="#607D8B" font-size="9.5" font-weight="bold" letter-spacing="0.5">BACKWARD</text>

  <!-- 6. Reward -->
  <rect x="570" y="248" width="130" height="34" rx="2" fill="#FFF3E0" stroke="#FFCC80" stroke-width="1"/>
  <text x="635" y="269" text-anchor="middle" fill="#424242" font-size="11">Reward</text>
  <!-- bg rect first, then arrow on top, then text on top -->
  <rect x="543" y="250" width="24" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="570" y1="265" x2="540" y2="265" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="555" y="260" text-anchor="middle" fill="#607D8B" font-size="8.5" font-style="italic">scored</text>

  <!-- 7. DataCoordinator -->
  <rect x="410" y="248" width="130" height="34" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <text x="475" y="269" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">DataCoordinator</text>
  <rect x="384" y="250" width="22" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="410" y1="265" x2="380" y2="265" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="395" y="260" text-anchor="middle" fill="#607D8B" font-size="8.5" font-style="italic">batch</text>

  <!-- 8. TrainerGroup -->
  <rect x="250" y="248" width="130" height="34" rx="2" fill="#E8F5E9" stroke="#81C784" stroke-width="1.2"/>
  <text x="315" y="269" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">TrainerGroup</text>
  <rect x="222" y="250" width="26" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <line x1="250" y1="265" x2="220" y2="265" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="235" y="260" text-anchor="middle" fill="#607D8B" font-size="8.5" font-style="italic">update</text>

  <!-- 9. Actor Model -->
  <rect x="90" y="248" width="130" height="34" rx="2" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="155" y="269" text-anchor="middle" fill="#2E7D32" font-size="11">Actor Model</text>

  <!-- ====== WEIGHT SYNC: Actor → RolloutManager ====== -->
  <path d="M 155 248 L 155 125 L 390 125 L 390 96" stroke="#66BB6A" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arr-g)"/>
  <rect x="227" y="115" width="66" height="14" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="260" y="126" text-anchor="middle" fill="#2E7D32" font-size="9.5" font-weight="bold" font-style="italic">sync weights</text>

  <!-- Caption -->
  <text x="430" y="382" text-anchor="middle" fill="#555" font-size="10">Figure 2: End-to-End Data Flow</text>
</svg>
