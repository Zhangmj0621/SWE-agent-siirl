<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="700" height="260" fill="#fff"/>
  <rect x="20" y="10" width="660" height="200" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="660" height="28" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="29" text-anchor="middle" fill="#222" font-size="13" font-weight="bold" letter-spacing="0.3">Resume Training Flow</text>

  <!-- Layer 1: All boxes (evenly distributed: 4 boxes w=120, container inner=620, gap=(620-480)/3=46.7) -->
  <!-- x positions: 40, 40+120+47=207, 207+120+47=374, 374+120+47=541 -->
  <rect x="40" y="100" width="120" height="30" rx="1" fill="#FFF" stroke="#FFD54F" stroke-width="0.8"/>
  <text x="100" y="119" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">Load Ckpt</text>
  <rect x="207" y="100" width="120" height="30" rx="1" fill="#FFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="267" y="119" text-anchor="middle" fill="#424242" font-size="11">Restore State</text>
  <rect x="374" y="100" width="120" height="30" rx="1" fill="#FFF" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="434" y="119" text-anchor="middle" fill="#424242" font-size="11">Sync Weights</text>
  <rect x="541" y="100" width="120" height="30" rx="1" fill="#FFF" stroke="#81C784" stroke-width="0.8"/>
  <text x="601" y="119" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">Resume Loop</text>

  <!-- Layer 2: Arrows between boxes -->
  <line x1="160" y1="115" x2="207" y2="115" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="327" y1="115" x2="374" y2="115" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="494" y1="115" x2="541" y2="115" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Step numbers -->
  <text x="100" y="90" text-anchor="middle" fill="#9E9E9E" font-size="9" font-style="italic">Step 1</text>
  <text x="267" y="90" text-anchor="middle" fill="#9E9E9E" font-size="9" font-style="italic">Step 2</text>
  <text x="434" y="90" text-anchor="middle" fill="#9E9E9E" font-size="9" font-style="italic">Step 3</text>
  <text x="601" y="90" text-anchor="middle" fill="#9E9E9E" font-size="9" font-style="italic">Step 4</text>

  <!-- Caption -->
  <text x="350" y="245" text-anchor="middle" fill="#555" font-size="10">Figure 2: How training resumes from checkpoint</text>
</svg>
