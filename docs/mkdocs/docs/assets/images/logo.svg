<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Main gradient: deep purple to indigo -->
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <!-- Teal accent gradient -->
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <!-- Radial glow for center -->
    <radialGradient id="grad-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <!-- Arrow marker -->
    <marker id="arrow1" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#818cf8"/>
    </marker>
    <marker id="arrow2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-teal" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#14b8a6"/>
    </marker>
  </defs>

  <!-- Subtle background glow -->
  <circle cx="256" cy="256" r="200" fill="url(#grad-glow)"/>

  <!-- Outer hexagon frame -->
  <polygon
    points="256,56 433,156 433,356 256,456 79,356 79,156"
    fill="none"
    stroke="url(#grad-main)"
    stroke-width="6"
    stroke-linejoin="round"
    opacity="0.35"
  />

  <!-- Inner hexagon frame -->
  <polygon
    points="256,96 400,176 400,336 256,416 112,336 112,176"
    fill="none"
    stroke="url(#grad-main)"
    stroke-width="3"
    opacity="0.15"
  />

  <!-- Orbiting arc 1 (top-right, clockwise) -->
  <path
    d="M 340,130 A 160,160 0 0,1 410,280"
    fill="none"
    stroke="#818cf8"
    stroke-width="5"
    stroke-linecap="round"
    marker-end="url(#arrow1)"
    opacity="0.8"
  />

  <!-- Orbiting arc 2 (bottom, clockwise) -->
  <path
    d="M 370,340 A 160,160 0 0,1 170,400"
    fill="none"
    stroke="#6366f1"
    stroke-width="5"
    stroke-linecap="round"
    marker-end="url(#arrow2)"
    opacity="0.7"
  />

  <!-- Orbiting arc 3 (left, clockwise) -->
  <path
    d="M 130,360 A 160,160 0 0,1 120,170"
    fill="none"
    stroke="#14b8a6"
    stroke-width="5"
    stroke-linecap="round"
    marker-end="url(#arrow-teal)"
    opacity="0.7"
  />

  <!-- Central agent network: hub and spokes -->
  <!-- Center node (agent brain) -->
  <circle cx="256" cy="256" r="36" fill="url(#grad-main)" opacity="0.95"/>
  <circle cx="256" cy="256" r="22" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
  <!-- Inner brain pattern: small nodes inside center -->
  <circle cx="248" cy="248" r="4" fill="#ffffff" opacity="0.85"/>
  <circle cx="264" cy="248" r="4" fill="#ffffff" opacity="0.85"/>
  <circle cx="256" cy="264" r="4" fill="#ffffff" opacity="0.85"/>
  <!-- Connections inside brain -->
  <line x1="248" y1="248" x2="264" y2="248" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="248" y1="248" x2="256" y2="264" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="264" y1="248" x2="256" y2="264" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

  <!-- Satellite node 1 (top) -->
  <line x1="256" y1="220" x2="256" y2="168" stroke="url(#grad-main)" stroke-width="3" opacity="0.6"/>
  <circle cx="256" cy="158" r="16" fill="url(#grad-main)" opacity="0.7"/>
  <circle cx="256" cy="158" r="8" fill="#ffffff" opacity="0.5"/>

  <!-- Satellite node 2 (bottom-right) -->
  <line x1="280" y1="274" x2="330" y2="318" stroke="url(#grad-main)" stroke-width="3" opacity="0.6"/>
  <circle cx="340" cy="326" r="16" fill="url(#grad-main)" opacity="0.7"/>
  <circle cx="340" cy="326" r="8" fill="#ffffff" opacity="0.5"/>

  <!-- Satellite node 3 (bottom-left) -->
  <line x1="232" y1="274" x2="182" y2="318" stroke="url(#grad-main)" stroke-width="3" opacity="0.6"/>
  <circle cx="172" cy="326" r="16" fill="url(#grad-main)" opacity="0.7"/>
  <circle cx="172" cy="326" r="8" fill="#ffffff" opacity="0.5"/>

  <!-- Gear/tool element (top-right area) -->
  <g transform="translate(370, 120)" opacity="0.85">
    <!-- Gear body -->
    <circle cx="0" cy="0" r="18" fill="url(#grad-teal)" opacity="0.9"/>
    <!-- Gear teeth -->
    <rect x="-3" y="-26" width="6" height="10" rx="2" fill="#14b8a6"/>
    <rect x="-3" y="16" width="6" height="10" rx="2" fill="#14b8a6"/>
    <rect x="-26" y="-3" width="10" height="6" rx="2" fill="#14b8a6"/>
    <rect x="16" y="-3" width="10" height="6" rx="2" fill="#14b8a6"/>
    <!-- Diagonal teeth -->
    <rect x="11" y="-22" width="6" height="10" rx="2" fill="#14b8a6" transform="rotate(45, 14, -17)"/>
    <rect x="-17" y="12" width="6" height="10" rx="2" fill="#14b8a6" transform="rotate(45, -14, 17)"/>
    <rect x="-22" y="-17" width="10" height="6" rx="2" fill="#14b8a6" transform="rotate(45, -17, -14)"/>
    <rect x="12" y="11" width="10" height="6" rx="2" fill="#14b8a6" transform="rotate(45, 17, 14)"/>
    <!-- Gear center hole -->
    <circle cx="0" cy="0" r="7" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Connection line from gear to network -->
  <line x1="355" y1="135" x2="280" y2="200" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
</svg>
