<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="700" height="300" fill="#fff"/>
  <rect x="20" y="10" width="660" height="240" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="660" height="32" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="31" text-anchor="middle" fill="#222" font-size="14" font-weight="bold" letter-spacing="0.3">Eval Scaling Timeline</text>

  <!-- ====== Layer 1: All boxes and labels ====== -->

  <!-- Swimlane labels -->
  <text x="80" y="120" text-anchor="middle" fill="#424242" font-size="12">Eval Worker 1</text>
  <text x="80" y="165" text-anchor="middle" fill="#424242" font-size="12">Eval Worker 2</text>
  <text x="80" y="210" text-anchor="middle" fill="#424242" font-size="12">Eval Worker 3</text>

  <!-- Batch bars (staggered for parallel visualization) -->
  <rect x="150" y="105" width="200" height="30" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1"/>
  <text x="250" y="124" text-anchor="middle" fill="#1565C0" font-size="10.5">Batch 1</text>

  <rect x="150" y="150" width="200" height="30" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1"/>
  <text x="250" y="169" text-anchor="middle" fill="#1565C0" font-size="10.5">Batch 2</text>

  <rect x="150" y="195" width="200" height="30" rx="2" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1"/>
  <text x="250" y="214" text-anchor="middle" fill="#1565C0" font-size="10.5">Batch 3</text>

  <!-- ====== Layer 2: Time axis arrow ====== -->
  <line x1="150" y1="235" x2="600" y2="235" stroke="#78909C" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Time label -->
  <rect x="348" y="242" width="54" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="375" y="252" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">Time</text>

  <!-- Caption -->
  <text x="350" y="285" text-anchor="middle" fill="#555" font-size="10">Figure 2: Parallel evaluation scaling</text>
</svg>
