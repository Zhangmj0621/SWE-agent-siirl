  <text x="180.0" y="113.0" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">RolloutManager.rollout()</text>
  <rect x="386" y="94" width="228" height="30" rx="1" fill="#FFFFFF" stroke="#CE93D8" stroke-width="0.8"/>
  <text x="500.0" y="113.0" text-anchor="middle" fill="#424242" font-size="12.5" font-weight="600">AgentExecutor.execute()</text>
  <rect x="330" y="200" width="240" height="30" rx="1" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="450.0" y="219.0" text-anchor="middle" fill="#424242" font-size="12" font-weight="normal">_handle_pending_state()</text>
