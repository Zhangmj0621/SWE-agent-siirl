  <text x="301.5" y="236.5" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">fetch batch</text>
  <line x1="430.0" y1="225" x2="425.0" y2="260" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="427.5" y="236.5" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">model inference</text>
  <line x1="430.0" y1="225" x2="680.0" y2="260" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="555.0" y="236.5" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">value estimation (PPO)</text>
  <line x1="425.0" y1="290" x2="425.0" y2="325" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="680.0" y1="290" x2="425.0" y2="325" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="425.0" y1="355" x2="425.0" y2="390" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="425.0" y="366.5" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">GAE / GRPO</text>
  <line x1="425.0" y1="420" x2="425.0" y2="455" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="425.0" y="431.5" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">dual-clip PPO loss</text>
  <line x1="425.0" y1="485" x2="430.0" y2="572" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="427.5" y="522.5" text-anchor="middle" fill="#607D8B" font-size="10.5" font-style="italic">gradient update</text>
  <text x="430.0" y="665" text-anchor="middle" fill="#555" font-size="10">Figure 1: Training Step Data Flow</text>
