<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.8, 7 3, 0 5.2" fill="#78909C"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fff"/>
  <rect x="20" y="10" width="660" height="340" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="10" width="660" height="28" rx="0" fill="#F8F9FA" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="29" text-anchor="middle" fill="#222" font-size="13" font-weight="bold" letter-spacing="0.3">Checkpoint Structure</text>

  <!-- Layer 1: All component boxes -->
  <!-- Checkpoint container -->
  <rect x="200" y="55" width="300" height="250" rx="2" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.2"/>
  <rect x="200" y="55" width="300" height="26" rx="2" fill="#FFECB3" stroke="#FFD54F" stroke-width="1.2"/>
  <text x="350" y="73" text-anchor="middle" fill="#F57F17" font-size="13" font-weight="bold">Checkpoint</text>

  <!-- Checkpoint sub-components (evenly distributed vertically) -->
  <rect x="240" y="96" width="220" height="28" rx="1" fill="#FFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="350" y="114" text-anchor="middle" fill="#424242" font-size="11">Model Weights</text>
  <rect x="240" y="141" width="220" height="28" rx="1" fill="#FFF" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="350" y="159" text-anchor="middle" fill="#424242" font-size="11">Optimizer State</text>
  <rect x="240" y="186" width="220" height="28" rx="1" fill="#FFF" stroke="#E0E0E0" stroke-width="0.8"/>
  <text x="350" y="204" text-anchor="middle" fill="#424242" font-size="11">Config</text>
  <rect x="240" y="231" width="220" height="28" rx="1" fill="#FFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="350" y="249" text-anchor="middle" fill="#424242" font-size="11">Global Step</text>

  <!-- save() and load() boxes -->
  <rect x="40" y="145" width="100" height="30" rx="1" fill="#FFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="90" y="164" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">save()</text>
  <rect x="560" y="145" width="100" height="30" rx="1" fill="#FFF" stroke="#FFE082" stroke-width="0.8"/>
  <text x="610" y="164" text-anchor="middle" fill="#424242" font-size="11" font-weight="600">load()</text>

  <!-- Layer 2: All arrows (orthogonal only) -->
  <!-- save() -> Checkpoint: horizontal arrow at y=160 -->
  <line x1="140" y1="160" x2="200" y2="160" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Checkpoint -> load(): horizontal arrow at y=160 -->
  <line x1="500" y1="160" x2="560" y2="160" stroke="#78909C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Labels with white bg -->
  <rect x="155" y="148" width="30" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="170" y="158" text-anchor="middle" fill="#607D8B" font-size="9" font-style="italic">write</text>

  <rect x="515" y="148" width="30" height="13" rx="1" fill="#fff" fill-opacity="0.9"/>
  <text x="530" y="158" text-anchor="middle" fill="#607D8B" font-size="9" font-style="italic">read</text>

  <!-- Caption -->
  <text x="350" y="385" text-anchor="middle" fill="#555" font-size="10">Figure 1: What's saved in a checkpoint</text>
</svg>
